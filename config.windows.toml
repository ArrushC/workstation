# config.windows.toml: Windows-only dotfiles and GUI apps (MISE_ENV token `windows`; loads
# alongside config.toml).

# Every [dotfiles] entry is `copy` (or `template` for .tera sources), never symlink: a file
# symlink needs Developer Mode and silently falls back to a copy without it, and a
# directory symlink becomes a junction. `template` is a separate requirement:
# `copy` would deploy a Tera source with its `{{ ... }}` unrendered.
[dotfiles]
# Windows Terminal rewrites this every launch (reorders keys, regenerates dynamic
# profiles): re-add with `mise dot add --changed` after a Settings-UI edit. The
# missing trailing newline is WT-native; leave it.
# JSON can't carry comments, so the rules live here:
#  - disabledProfileSources: ["Windows.Terminal.SSH"] is load-bearing; it stops WT
#    injecting a zellij-less duplicate of every ssh host.
#  - showSuggestions sources are `tasks` and `commandHistory`; `recentCommands` is
#    invalid and makes WT reject the whole file.
#  - a per-profile colorScheme overrides profiles.defaults.
"~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json" = { source = "dotfiles/windows/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json", mode = "copy" }

# Warp rewrites this and hot-reloads external edits: re-add with
# `mise dot add --changed` after a UI edit.
# The theme `path` must be a relative filename (warp#9723). The privacy block pins
# values even where they equal upstream defaults, because new sections arrive with
# permissive defaults. Warp's Settings panel rewrites inline-table arrays as
# multi-line with trailing commas (TOML v1.1), which Python tomllib (v1.0) rejects;
# the tracked file keeps them single-line. Never wire it into a tomllib-based check
# without accounting for a post-`wsr` reformat.
"~/AppData/Local/warp/Warp/config/settings.toml" = { source = "dotfiles/windows/AppData/Local/warp/Warp/config/settings.toml", mode = "copy" }
# Edit-in-repo-only; kept beside settings.toml so the config tree stays together.
"~/AppData/Local/warp/Warp/config/keybindings.yaml" = { source = "dotfiles/windows/AppData/Local/warp/Warp/config/keybindings.yaml", mode = "copy" }
# winget's user settings (`winget --info` shows the path). Edit-in-repo-only; JSON
# can't carry comments, so the rule lives here: installBehavior.preferences.scope
# = "user" makes every winget install, [bootstrap.packages] below included, pick a
# per-user installer when the package has one, and fall back to machine scope when
# it doesn't (Zed's only installer claims machine scope but installs per-user).
"~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/settings.json" = { source = "dotfiles/windows/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/settings.json", mode = "copy" }
# Edit-in-repo-only. Warp's Local/Roaming split must be preserved (collapsing it
# makes Warp ignore the file).
"~/AppData/Roaming/warp/Warp/data/themes/catppuccin-mocha.yaml" = { source = "dotfiles/windows/AppData/Roaming/warp/Warp/data/themes/catppuccin-mocha.yaml", mode = "copy" }

# VS Code's Preferences UI writes these in place.
"~/AppData/Roaming/Code/User/settings.json" = { source = "dotfiles/windows/AppData/Roaming/Code/User/settings.json", mode = "copy" }
"~/AppData/Roaming/Code/User/keybindings.json" = { source = "dotfiles/windows/AppData/Roaming/Code/User/keybindings.json", mode = "copy" }

# Zed writes these in place (as with the Linux entry in config.linux.toml).
"~/AppData/Roaming/Zed/settings.json" = { source = "dotfiles/windows/AppData/Roaming/Zed/settings.json", mode = "copy" }
"~/AppData/Roaming/Zed/keymap.json" = { source = "dotfiles/windows/AppData/Roaming/Zed/keymap.json", mode = "copy" }

# Rendered from the Linux helix source (config.linux.toml) via Tera read_file(), not
# edited independently; the template swaps the OSC 52 clipboard for the Win32 one.
# languages.toml and the theme are the Linux files as they are (llvm-mingw, config.toml, provides clangd, clang-format and lldb-dap).
"~/AppData/Roaming/helix/config.toml" = { source = "dotfiles/windows/AppData/Roaming/helix/config.toml.tera", mode = "template" }
"~/AppData/Roaming/helix/languages.toml" = { source = "dotfiles/config/helix/languages.toml", mode = "copy" }
"~/AppData/Roaming/helix/themes/catppuccin_mocha_mauve.toml" = { source = "dotfiles/config/helix/themes/catppuccin_mocha_mauve.toml", mode = "copy" }
# Neovim: the tree config.linux.toml deploys to ~/.config/nvim; Windows Neovim reads
# %LOCALAPPDATA%\nvim. The lockfile is its own entry for the same reason (wsr skips
# directory entries; vim.pack rewrites it on :PackUpdate).
"~/AppData/Local/nvim" = { source = "dotfiles/config/nvim", mode = "copy", exclude = [".vendor", ".gitkeep", "nvim-pack-lock.json"] }
"~/AppData/Local/nvim/nvim-pack-lock.json" = { source = "dotfiles/config/nvim/nvim-pack-lock.json", mode = "copy" }
# hostname/username banner + ws* aliases; renders host/user identity via exec().
"~/AppData/Roaming/nushell/config.nu" = { source = "dotfiles/windows/AppData/Roaming/nushell/config.nu.tera", mode = "template" }
# Vendored Catppuccin Mocha theme (provenance in the source dir's .vendor); Nushell's user autoload
# dir sources it after config.nu. Edit-in-repo-only (re-vendor to change it).
"~/AppData/Roaming/nushell/autoload/catppuccin_mocha.nu" = { source = "dotfiles/windows/AppData/Roaming/nushell/autoload/catppuccin_mocha.nu", mode = "copy" }
# Loads after catppuccin_mocha.nu (autoload runs in name order): command-line colours
# matching zsh's highlighting on the Linux hosts (check_shell_highlight_parity).
"~/AppData/Roaming/nushell/autoload/syntax-highlight.nu" = { source = "dotfiles/windows/AppData/Roaming/nushell/autoload/syntax-highlight.nu", mode = "copy" }
# Catppuccin Mocha for bat, eza and yazi, from the same sources as config.linux.toml's
# entries; Windows keeps their configs under %APPDATA% (atuin's pair is in config.toml).
"~/AppData/Roaming/bat/config/theme" = { line = '--theme="Catppuccin Mocha"' }
"~/AppData/Roaming/eza/theme.yml" = { source = "dotfiles/config/eza/theme.yml", mode = "copy" }
"~/AppData/Roaming/yazi/config/theme.toml" = { source = "dotfiles/config/yazi/theme.toml", mode = "copy" }
"~/AppData/Roaming/yazi/config/flavors/catppuccin-mocha.yazi" = { source = "dotfiles/config/yazi/flavors/catppuccin-mocha.yazi", mode = "copy", exclude = [".vendor", ".gitkeep"] }
# PS7+ canonical $PROFILE.
"~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = { source = "dotfiles/windows/Documents/PowerShell/Microsoft.PowerShell_profile.ps1.tera", mode = "template" }
# Dot-source shim that loads the PS7 profile above when present.
"~/Documents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1" = { source = "dotfiles/windows/Documents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1", mode = "copy" }

# Edited only in-repo; the `wsl --shutdown` reminder after a change is a
# bootstrap.ps1 sha256-marker step, not a dotfiles concern.
"~/.wslconfig" = { source = "dotfiles/wslconfig", mode = "copy" }

# Nushell's generated init files (starship, mise, zoxide, atuin, LS_COLORS in
# vendor\autoload) and the PowerShell profile's (%LOCALAPPDATA%\workstation\pwsh-init)
# follow the installed tools: the post-tools hook reruns nu-init after every tools
# phase (bootstrap.ps1, wsu). Windows runs tasks and hooks with `cmd /c`; a failing
# hook stops `mise bootstrap`, so the task ends `|| exit /b 0` (a stale init file
# is better than a stopped bootstrap).
[tasks.nu-init]
description = "Regenerate Nushell's and PowerShell's tool init files (starship, mise, zoxide, atuin, LS_COLORS)"
dir = "{{ xdg_config_home }}/mise"
run = "nu --no-config-file scripts/nu-init.nu || exit /b 0"

# Neovim's plugins, blink.cmp's matcher and the treesitter parsers: tasks/nvim-plugins'
# job (lua/ws/provision.lua), from post-tools since Windows never runs `final`
# (bootstrap.ps1 and wsu pass --only dotfiles,tools). Its own name: a [tasks] entry named
# like a file in tasks/ is listed, but `mise run` runs the (bash) file.
[tasks.nvim-plugins-win]
description = "Install Neovim's plugins at nvim-pack-lock.json's commits, blink.cmp's matcher and the treesitter parsers (the post-tools hook)"
dir = "{{ xdg_config_home }}/mise"
run = "nu --no-config-file scripts/nvim-plugins.nu || exit /b 0"

# The archify skill into %USERPROFILE%\.claude\skills: tasks/claude's job on Linux.
[tasks.claude-skills-win]
description = "Copy mise's archify skill to ~/.claude/skills/archify (the post-tools hook)"
dir = "{{ xdg_config_home }}/mise"
run = "nu --no-config-file scripts/claude-skills.nu || exit /b 0"

# ~/.claude/settings.json's seed + live + enforced merge (scripts/lib/claude-settings-merge.sh's
# jq filter): tasks/claude's job on Linux, which wsu runs there through the full bootstrap.
# Here wsu runs only --only dotfiles,tools, so the merge hangs off post-tools, or a change to
# settings.enforced.json (the theme, a plugin) would wait for the next bootstrap.ps1.
[tasks.claude-settings-win]
description = "Merge settings.seed.json, the live ~/.claude/settings.json and settings.enforced.json (the post-tools hook)"
dir = "{{ xdg_config_home }}/mise"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/claude-settings-merge.ps1 || exit /b 0"

# WezTerm's nightly build, per-user in %LOCALAPPDATA%\workstation\wezterm, checked against
# the SHA256 WezTerm publishes beside the zip. Not a mise pin (the rolling nightly asset
# outdates a locked checksum the next day) and not winget (its nightly manifest's checksum
# lags the asset, and both WezTerm packages' installers raise UAC). It downloads only
# when a new nightly exists; scripts/wezterm-nightly.ps1 has the details. It also points
# WEZTERM_CONFIG_FILE at dotfiles/config/wezterm/wezterm.lua, so WezTerm loads its config
# from this checkout (no [dotfiles] copy), and puts the wezterm CLI on the User PATH.
[tasks.wezterm-nightly-win]
description = "Install or update WezTerm's nightly build (the post-tools hook)"
dir = "{{ xdg_config_home }}/mise"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/wezterm-nightly.ps1 || exit /b 0"

# ws update (wsu): tasks/update is bash and ends in an unscoped bootstrap, so Windows pulls
# and bootstraps dotfiles and tools only, as bootstrap.ps1 does (scripts/update.ps1).
[tasks.update-windows]
description = "Update this Windows host: pull, then mise bootstrap dotfiles and tools"
run_windows = 'powershell -NoProfile -ExecutionPolicy Bypass -File "{{ xdg_config_home }}/mise/scripts/update.ps1"'
run = "echo 'update-windows requires Windows' >&2; exit 1"

# ws reconcile's baseline and pre-apply backups (scripts/ws; tasks/dotfiles-baseline and
# tasks/dotfiles-snapshot on Linux). Before the tools phase has installed mise's Python (a
# fresh host) `python` fails, and `exit /b 0` keeps the bootstrap going. The snapshot passes
# one status through: 3, a file the apply would overwrite that couldn't be backed up, which
# stops the bootstrap (`if errorlevel 3 if not errorlevel 4` is exactly 3; a missing python's
# 9009 isn't). These hooks also
# run when Linux renders this file's templates (check-templates.sh, CI's templates job),
# where there is no Windows home to keep a baseline for: `run` is a no-op there, and no `dir`,
# because {{ xdg_config_home }}/mise needn't exist on that host.
[tasks.dotfiles-baseline-win]
description = "post-dotfiles hook: record what each managed dotfile now agrees on, ws reconcile's baseline"
hide = true
run_windows = 'python "{{ xdg_config_home }}/mise/scripts/ws/ws.py" baseline record || exit /b 0'
run = "true"

[tasks.dotfiles-snapshot-win]
description = "pre-dotfiles hook: back up each local dotfile edit an apply would overwrite (ws reconcile --backups)"
hide = true
run_windows = 'python "{{ xdg_config_home }}/mise/scripts/ws/ws.py" baseline snapshot || (if errorlevel 3 if not errorlevel 4 exit /b 3) & exit /b 0'
run = "true"

[bootstrap.hooks]
post-tools = "mise run nu-init ::: nvim-plugins-win ::: claude-skills-win ::: claude-settings-win ::: wezterm-nightly-win"
pre-dotfiles = "mise run --skip-tools dotfiles-snapshot-win"
post-dotfiles = "mise run --skip-tools dotfiles-baseline-win"

# GUI apps, installed by `mise bootstrap --only packages` (bootstrap.ps1 runs it after
# the dotfiles, so winget's scope preference above is already in place). An app counts
# as installed when `winget list --id <Id> --exact` finds it; "latest" because each one
# self-updates (`mise bootstrap packages upgrade --manager winget` updates them all).
# SSHFS-Win is not here: mise installs silently, and its WinFsp MSI must raise UAC, so
# bootstrap.ps1's Install-SshfsWin installs it (check_bootstrap_config keeps it out).
[bootstrap.packages]
"winget:Microsoft.WindowsTerminal" = "latest"
"winget:Warp.Warp" = "latest"
"winget:Obsidian.Obsidian" = "latest"
"winget:9NBN8W1DS547" = "latest"   # DevToys, the Microsoft Store build (winget can't match an Inno-installed preview to DevToys-app.DevToys)
"winget:DBeaver.DBeaver.Community" = "latest"
"winget:WinSCP.WinSCP" = "latest"
"winget:ScooterSoftware.BeyondCompare.5" = "latest"
"winget:ZedIndustries.Zed" = "latest"
