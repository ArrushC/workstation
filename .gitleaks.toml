# .gitleaks.toml — config for the committed-secret scan.
# Consumed by scripts/check-invariants.sh (check_gitleaks), `make secrets`, and
# CI (.github/workflows/lint.yml). Extends gitleaks' bundled default ruleset,
# then allowlists this repo's known-safe, secret-shaped-but-not-secret content
# so the gate doesn't false-positive on a docs-heavy, age-encrypted repo.
#
# The gate still protects the code/config/dotfiles surface (where a real leak
# would land — the age identity, SSH keys, tokens in scripts/templates); only
# the prose/ciphertext paths below are exempt.

title = "workstation gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "workstation false-positive allowlist (paths are regexes vs the file path)"
paths = [
  # age-encrypted blobs are ciphertext, not plaintext secrets.
  '''\.age$''',
  # Docs/specs/changelog describe credential & token PATTERNS conceptually
  # (curl|bash, $env:GITHUB_TOKEN, secret-guard rules) — not real secrets.
  '''(^|/)docs/''',
  '''\.md$''',
  '''(^|/)README\.html$''',
  '''(^|/)CLAUDE\.md$''',
]
