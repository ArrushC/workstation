# ~/.config/mise/config.toml — this repository IS mise's global config dir.
#
# Which files load is picked by miserc.toml's `env` (written by
# scripts/lib/mise-env.sh; an exported MISE_ENV overrides it):
#   config.toml          always            (every host: both-OS tools, dotfiles, vars)
#   config.linux.toml    linux             (the Linux toolbelt, dotfiles and host state)
#   config.windows.toml  windows           (Windows-only dotfiles and winget apps)
#   config.local.toml    always, git-ignored — per-host overrides
# Pins live here and in mise.lock (URLs + sha256 per platform). Bump with
# `scripts/bump-versions.sh` (`mise run bump-versions`).
min_version = "2026.9.9"

# Installs read the lock files and never rewrite them. Each OS's mise rewrites the
# other OS's entries for tools with per-platform options (DevToys, yazi, atuin, delta):
# Windows reorders them, Linux drops them. That dirties the checkout, and the next
# wsu's `git pull --ff-only` fails. `mise lock` (bump-versions) still writes. A pin
# with no lock entry for this platform won't install, so refresh the locks first.
# Lock-file-off installs (CI's shfmt/gitleaks, the bumper's uv) set MISE_LOCKED=0.
[settings]
locked = true

[vars]
# Host pins that tasks read via `#MISE env={X="{{ vars.x }}"}`;
# scripts/check-invariants.sh asserts the dual-edits.
vcpkg_version = "2026.07.29"     # microsoft/vcpkg release tag checked out by tasks/vcpkg
zjstatus_zellij_floor = "0.45.0" # zjstatus' stated zellij floor; check-invariants asserts tools.zellij >= this (not a pin — never bumped by the bumper)

[tools]
# Both OSes (Windows installs them through mise too)
starship = "1.26.0"
# helix on Windows: aqua's archive carries runtime/ beside hx, so no HELIX_RUNTIME. Linux
# takes conda-forge's build (config.linux.toml): the GitHub archive needs glibc 2.34, past
# EL8's 2.28, and conda-forge has no Windows build.
helix = { version = "25.07.1", os = ["windows"] }
jq = "1.8.2"
gh = "2.102.0"
# The zsh toolbelt Nushell on Windows shares (pickers, z/zi, Ctrl-R history, eza listings, delta pager).
fzf = "0.74.4"
zoxide = "0.10.0"
fd = "10.5.0"
bat = "0.26.1"
eza = "0.23.5"
ripgrep = "15.2.0"
# aqua's Linux builds are gnu (GLIBC_2.29+, past EL8's 2.28), so Linux pins musl; Windows takes the msvc zip.
"github:dandavison/delta" = { version = "0.20.1", platforms = { linux-x64 = { asset_pattern = "delta-{{version}}-x86_64-unknown-linux-musl.tar.gz" }, windows-x64 = { asset_pattern = "delta-{{version}}-x86_64-pc-windows-msvc.zip" } } }
"github:sxyazi/yazi" = { version = "26.9.1", platforms = { linux-x64 = { asset_pattern = "yazi-x86_64-unknown-linux-musl.zip" }, windows-x64 = { asset_pattern = "yazi-x86_64-pc-windows-msvc.zip" } } }
"github:atuinsh/atuin" = { version = "18.23.0", platforms = { linux-x64 = { asset_pattern = "atuin-x86_64-unknown-linux-musl.tar.gz" }, windows-x64 = { asset_pattern = "atuin-x86_64-pc-windows-msvc.zip" } } }
# uv: builds the python-env venv (on mise's python, below). Pinned >= 0.12.10 because
# `mise lock` refuses Python dependency locks (pypi:/pipx: tools) below that.
uv = "0.12.23"
# python: interpreter for the dependency-locked pypi: tools (without it mise
# falls back to the system 3.9 and glances/harlequin refuse to install) and
# for python-env's venv (tasks/python-env; bootstrap.ps1 on Windows). It shadows
# `python3` in mise-activated shells; the system interpreter stays /usr/bin/python3.
python = "3.14.8"

# ---------------------------------------------------------------------------
# Personal toolbelt (both OSes; Windows-only and Linux-only entries carry `os = [...]`;
# %USERPROFILE%\.config\mise is this same checkout on Windows).
# ---------------------------------------------------------------------------

# The npm language servers ride node's postinstall so typescript-language-server
# finds typescript as a global sibling (separate npm: trees would break that). A
# changed postinstall only re-runs when node reinstalls; scripts/lib/mise-install.sh
# forces it. --allow-scripts=core-js silences npm 11's install-scripts warning.
node = { version = "26.10.0", postinstall = "npm install -g --allow-scripts=core-js typescript-language-server@6.0.1 typescript@5.9.3 bash-language-server@5.8.1 yaml-language-server@1.24.0 vscode-langservers-extracted@4.10.0" }
go = "1.27.1"
"go:golang.org/x/tools/gopls" = "0.23.0"
lua-language-server = "3.19.1"
"pypi:basedpyright" = "1.40.2"
"npm:ccstatusline" = "2.2.30"                 # Claude Code statusline; enforced statusLine command becomes plain `ccstatusline`
"github:ryanoasis/nerd-fonts" = { version = "3.5.1", asset_pattern = "JetBrainsMono.tar.xz" }   # JetBrainsMono Nerd Font, the only pin: tasks/fonts (Linux) and bootstrap.ps1 (Windows, via scripts/install-nerd-fonts.ps1) install its TTFs
herdr = { version = "0.9.3", os = ["linux"] }
opencode = "1.18.34"
"github:can1357/oh-my-pi" = "18.6.1"   # bare per-platform binary asset; Linux auto-strips the suffix to `omp` (bin= would make a non-.exe file on Windows)
"github:pwndbg/pwndbg" = { version = "2026.09.15", os = ["linux"], version_prefix = "", asset_pattern = "pwndbg_{{version}}_x86_64-portable.tar.xz", bin_path = "pwndbg/bin" }   # archive extracts a top-level pwndbg/ wrapper dir
"github:DevToys-app/DevToys" = { version = "2.0.9.0", platforms = { linux-x64 = { asset_pattern = "devtoys.cli_linux_x64_portable.zip", rename_exe = { "DevToys.CLI" = "devtoys.cli" } }, windows-x64 = { asset_pattern = "devtoys.cli_win_x64_portable.zip" } } }   # CLI only; per-platform assets
nushell = { version = "0.113.1", os = ["windows"] }   # Windows default shell (WT); launched via %LOCALAPPDATA%\mise\shims\nu.exe
"github:carapace-sh/carapace-bin" = { version = "1.8.0", os = ["windows"], asset_pattern = "carapace-bin_{{version}}_windows_amd64.zip" }   # Nushell's Tab completion for ~1000 CLIs (config.nu's external completer)
"github:dnGrep/dnGrep" = { version = "5.0.30.0", os = ["windows"], asset_pattern = "dnGrep.{{version}}.x64.zip" }   # GUI grep; Start Menu shortcut + settings seed by bootstrap.ps1
"github:LogExperts/LogExpert" = { version = "1.41.0", os = ["windows"], asset_pattern = "LogExpert.{{version}}.zip" }   # GUI log viewer (needs the .NET 10 Desktop Runtime); Start Menu shortcut by bootstrap.ps1

# ---------------------------------------------------------------------------
# [dotfiles]: `template` for .tera sources, `copy` for everything else, never
# symlink (apps on both OSes replace symlinks). Deployed files are independent
# copies: record a live edit back with `wsr` (`mise dot add --changed`), or
# `mise dot add <dir>` for a directory entry. Entries here load on every host,
# so only files meaningful on both OSes belong here; the rest live in the
# token-gated config.*.toml file that loads them (file map above).
# ---------------------------------------------------------------------------
[dotfiles]
# OS-branches internally: gh credential helper on Linux (gh, config.linux.toml);
# Git Credential Manager on Windows (ships with Git for Windows, a prerequisite
# bootstrap.ps1 checks but does not install).
"~/.gitconfig" = { source = "dotfiles/gitconfig.tera", mode = "template" }
# OS-branches internally: the ControlMaster block is non-Windows only. Template
# mode propagates the 0644 source mode; the post-dotfiles hook (config.linux.toml)
# chmods the target to 600.
"~/.ssh/config" = { source = "dotfiles/ssh/config.tera", mode = "template" }
# Same path on both OSes.
"~/.config/starship.toml" = { source = "dotfiles/config/starship.toml", mode = "copy" }

# Per-host opt-out: scripts/setup-ccstatusline.sh writes a CCSTATUSLINE-OPTOUT block
# into config.local.toml's own [dotfiles] table. `enabled = false` alone is silently
# ignored, so the written entry repeats `mode`. A live edit through ccstatusline's
# setup menu is recorded back with `wsr` (`mise dot add --changed`).
"~/.config/ccstatusline/settings.json" = { source = "dotfiles/config/ccstatusline/settings.json", mode = "copy" }

# ~/.claude tree. Directory mode 700 is restored by the post-dotfiles hook
# (config.linux.toml), since copy can't express a directory's mode. settings.json is
# merged by scripts/lib/claude-settings-merge.sh and settings.local.json is seeded if
# absent by tasks/bootstrap; neither is a [dotfiles] entry because Claude Code
# rewrites them. CLAUDE.md is the file agents are nudged to edit directly: `wsa`'s
# drift check (see CLAUDE.md) stops an apply from silently discarding such an edit.
"~/.claude/CLAUDE.md" = { source = "dotfiles/claude/CLAUDE.md", mode = "copy" }
"~/.claude/hooks" = { source = "dotfiles/claude/hooks", mode = "copy", exclude = [".vendor", ".gitkeep"] }   # dangerous-command-guard.sh, secret-guard.sh — both git mode 755; copy on a directory leaves unmanaged hooks (e.g. herdr-agent-state.sh) alone
"~/.claude/notify.sh" = { source = "dotfiles/claude/notify.sh", mode = "copy" }   # git mode 755; copy preserves the git-tracked executable bit from the source
# agents/commands are the two directories the user adds files to directly; capture
# a live addition with `mise dot add <dir>` (see CLAUDE.md).
"~/.claude/agents" = { source = "dotfiles/claude/agents", mode = "copy", exclude = [".vendor", ".gitkeep"] }
"~/.claude/commands" = { source = "dotfiles/claude/commands", mode = "copy", exclude = [".vendor", ".gitkeep"] }
"~/.claude/skills" = { source = "dotfiles/claude/skills", mode = "copy", exclude = [".vendor", ".gitkeep"] }   # workstation-lsp/ (.claude-plugin/plugin.json, .lsp.json, SKILL.md); copy so unmanaged skill dirs (e.g. computer-use, orca-cli, orchestration) survive

# Repo-maintenance tasks, run from this checkout. Tasks with real logic are
# files in tasks/.
[tasks.lint]
description = "Run the repo's invariant checks (pins, LF/exec bits, BOMs, sentinels, shellcheck, shfmt, gitleaks)"
dir = "{{ xdg_config_home }}/mise"
run = "scripts/check-invariants.sh"

[tasks.fmt]
description = "shfmt -w -i 2 over the first-party shell scripts (the list lint checks)"
dir = "{{ xdg_config_home }}/mise"
run = "shfmt -w -i 2 $(scripts/check-invariants.sh --shell-files)"

[tasks.secrets]
description = "Scan the working tree for committed secrets (gitleaks)"
dir = "{{ xdg_config_home }}/mise"
run = "gitleaks dir --no-banner --redact -c .gitleaks.toml ."

[tasks.ps-lint]
description = "PSScriptAnalyzer over the .ps1 scripts (skipped without pwsh; CI always runs it)"
dir = "{{ xdg_config_home }}/mise"
run = "if command -v pwsh >/dev/null 2>&1; then pwsh scripts/check-ps.ps1; else echo 'pwsh not installed: skipped (CI runs PowerShell lint)'; fi"

[tasks.bump-versions]
description = "Bump tool pins and [vars] pins against upstream and refresh the lock files (--dry-run previews)"
dir = "{{ xdg_config_home }}/mise"
run = "scripts/bump-versions.sh"

[tasks.install-hooks]
description = "Install mise's generated git pre-commit hook (runs mise run lint); once per clone"
dir = "{{ xdg_config_home }}/mise"
run = [
  "git config --unset core.hooksPath || true",
  "mise generate git-pre-commit --task lint --write",
]
