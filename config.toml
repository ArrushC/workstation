# ~/.config/mise/config.toml — this repository IS mise's global config dir.
#
# Which files load is picked by MISE_ENV (scripts/lib/mise-env.sh):
#   config.toml          always            (cross-platform: uv)
#   config.linux.toml    linux             (the Linux toolbelt, both modes)
#   config.owned.toml    owned             (owned-host tools on both OSes)
#   config.host.toml     host              (Linux owned: dnf + /etc)
#   config.native.toml   native            (non-WSL owned: NFS client)
#   config.wsl.toml      wsl               (/etc/wsl.conf)
#   config.windows.toml  windows           (Windows-only dotfiles surface)
#   config.local.toml    always, git-ignored — per-host overrides
# Pins live here and in mise.lock (URLs + sha256 per platform). Bump with
# `scripts/bump-versions.sh` (`mise run bump-versions`).
min_version = "2026.9.9"

[vars]
# Host pins that tasks read via `#MISE env={X="{{ vars.x }}"}`;
# scripts/check-invariants.sh asserts the dual-edits.
python_version = "3.14.7"        # == tools.python below == $PythonEnvVersion in bootstrap.ps1 (three-way pin)
nerd_font_version = "3.5.1"      # == SHA arm in scripts/lib/font.sh == $Version in scripts/install-nerd-fonts.ps1 (triple)
vcpkg_version = "2026.07.29"     # microsoft/vcpkg release tag checked out by tasks/vcpkg
zjstatus_zellij_floor = "0.45.0" # zjstatus' stated zellij floor; check-invariants asserts tools.zellij >= this (not a pin — never bumped by the bumper)

[tools]
# uv: the Python installer behind python-env. Pinned >= 0.12.10 because
# `mise lock` refuses Python dependency locks (pypi:/pipx: tools) below that.
uv = "0.12.19"
# python: interpreter for the dependency-locked pypi: tools (without it mise
# falls back to the system 3.9 and glances/harlequin refuse to install). Same pin
# as vars.python_version and $PythonEnvVersion in bootstrap.ps1. It shadows
# `python3` in mise-activated shells; the system interpreter stays /usr/bin/python3.
python = "3.14.7"

# ---------------------------------------------------------------------------
# [dotfiles]: `template` for .tera sources, `copy` for everything else, never
# symlink (apps on both OSes replace symlinks). Deployed files are independent
# copies: record a live edit back with `wsr` (`mise dot add --changed`), or
# `mise dot add <dir>` for a directory entry. Entries here load on every host,
# so only files meaningful on both OSes belong here; the rest live in the
# token-gated config.*.toml file that loads them (file map above).
# ---------------------------------------------------------------------------
[dotfiles]
# OS-branches internally: gh credential helper on Linux (gh, config.linux.toml);
# Git Credential Manager on Windows (ships with Git for Windows, a prerequisite
# bootstrap.ps1 checks but does not install).
"~/.gitconfig" = { source = "dotfiles/gitconfig.tera", mode = "template" }
# OS-branches internally: the ControlMaster block is non-Windows only. Template
# mode propagates the 0644 source mode; the post-dotfiles hook (config.linux.toml)
# chmods the target to 600.
"~/.ssh/config" = { source = "dotfiles/ssh/config.tera", mode = "template" }
# Same path on both OSes.
"~/.config/starship.toml" = { source = "dotfiles/config/starship.toml", mode = "copy" }

# Repo-maintenance tasks, run from this checkout. Tasks with real logic are
# files in tasks/.
[tasks.lint]
description = "Run the repo's invariant checks (pins, LF/exec bits, BOMs, sentinels, shellcheck, shfmt, gitleaks)"
dir = "{{ xdg_config_home }}/mise"
run = "scripts/check-invariants.sh"

[tasks.fmt]
description = "shfmt -w -i 2 over the first-party shell scripts (the list lint checks)"
dir = "{{ xdg_config_home }}/mise"
run = "shfmt -w -i 2 $(scripts/check-invariants.sh --shell-files)"

[tasks.secrets]
description = "Scan the working tree for committed secrets (gitleaks)"
dir = "{{ xdg_config_home }}/mise"
run = "gitleaks dir --no-banner --redact -c .gitleaks.toml ."

[tasks.ps-lint]
description = "PSScriptAnalyzer over the .ps1 scripts (skipped without pwsh; CI always runs it)"
dir = "{{ xdg_config_home }}/mise"
run = "if command -v pwsh >/dev/null 2>&1; then pwsh scripts/check-ps.ps1; else echo 'pwsh not installed: skipped (CI runs PowerShell lint)'; fi"

[tasks.bump-versions]
description = "Bump tool pins and [vars] pins against upstream and refresh the lock files (--dry-run previews)"
dir = "{{ xdg_config_home }}/mise"
run = "scripts/bump-versions.sh"

[tasks.install-hooks]
description = "Install mise's generated git pre-commit hook (runs mise run lint); once per clone"
dir = "{{ xdg_config_home }}/mise"
run = [
  "git config --unset core.hooksPath || true",
  "mise generate git-pre-commit --task lint --write",
]
