name: version-bumps
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch lint.yml on the bump PR (last step)

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
          install: false
          cache: true
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Propose version bumps
        run: bash scripts/bump-versions.sh
        env:
          # Write the summary OUTSIDE the working tree — peter-evans does
          # `git add -A`, so a repo-relative path would get committed into
          # the PR (and land in the repo on merge). runner.temp is ephemeral.
          BUMP_SUMMARY_FILE: ${{ runner.temp }}/bump-summary.md
          MISE_CONFIG_DIR: ${{ github.workspace }}
      # Validate the bumped tree here: a PR opened by GITHUB_TOKEN does NOT
      # trigger lint.yml (GitHub's recursion guard), so the invariant checker
      # must run in THIS workflow before the PR is created.
      - name: Verify invariants on the bumped tree
        run: bash scripts/check-invariants.sh
      - name: Create or update PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/version-bumps
          delete-branch: true
          title: 'chore(versions): weekly pin bumps'
          commit-message: 'chore(versions): weekly pin bumps'
          body-path: ${{ runner.temp }}/bump-summary.md
      # The recursion guard exempts workflow_dispatch, so run the full lint
      # workflow (templates, PowerShell, Windows) on the bump branch; its checks
      # land on the PR's head commit. Without this the PR shows no checks.
      - name: Run lint on the bump PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh workflow run lint.yml --repo "$GITHUB_REPOSITORY" --ref automation/version-bumps
        env:
          GH_TOKEN: ${{ github.token }}
