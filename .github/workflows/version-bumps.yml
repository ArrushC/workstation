name: version-bumps
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
          install: false
          cache: true
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Propose version bumps
        run: bash scripts/bump-versions.sh
        env:
          # Write the summary OUTSIDE the working tree — peter-evans does
          # `git add -A`, so a repo-relative path would get committed into
          # the PR (and land in the repo on merge). runner.temp is ephemeral.
          BUMP_SUMMARY_FILE: ${{ runner.temp }}/bump-summary.md
          MISE_CONFIG_DIR: ${{ github.workspace }}
      # Gate the PR on the invariant checker. lint.yml then runs on the PR itself,
      # but GitHub holds every workflow run on a PR opened by github-actions[bot]
      # until someone with write access approves it (since 2026-06-11, whatever the
      # repo's approval policy; this token can't approve). The PR body says so.
      - name: Verify invariants on the bumped tree
        run: bash scripts/check-invariants.sh
      - name: Create or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/version-bumps
          delete-branch: true
          title: 'chore(versions): weekly pin bumps'
          commit-message: 'chore(versions): weekly pin bumps'
          body-path: ${{ runner.temp }}/bump-summary.md
