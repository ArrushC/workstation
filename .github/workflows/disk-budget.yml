name: disk-budget
# Measures how much disk a fresh `mise install` of the toolbelt writes (tools,
# downloads and the uv/go/npm caches) for each OS, and commits the MB
# figures to disk-budget.toml on main. The free-space checks read that file:
# scripts/lib/mise-install.sh on Linux, bootstrap.ps1's Assert-ToolsDiskSpace on
# Windows. The Linux job also checks every installed binary runs on EL8's glibc 2.28.
# A pull request that changes this workflow measures and checks without committing.
on:
  push:
    branches: [main]
    paths: ['config*.toml', 'mise*.lock', 'locks/**', '.github/workflows/disk-budget.yml']
  pull_request:
    paths: ['.github/workflows/disk-budget.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
          install: false
          cache: false
      # An empty HOME holds everything the install writes (mise's data and cache
      # dirs, uv's cache, GOPATH, npm's cache), so one du measures all of it. The
      # pins are exact, so MISE_LOCKFILE=false installs the locked versions; it
      # avoids mise rewriting the lock files' sidecar refs (see lint.yml).
      - name: Install the toolbelt into an empty home and measure it
        env:
          MISE_ENV: linux
          MISE_CONFIG_DIR: ${{ github.workspace }}
          MISE_LOCKFILE: "false"
          MISE_LOCKED: "0"
        run: |
          h="$RUNNER_TEMP/home"
          mkdir -p "$h"
          export HOME="$h" XDG_DATA_HOME="$h/.local/share" XDG_CACHE_HOME="$h/.cache" XDG_STATE_HOME="$h/.local/state" GOPATH="$h/go"
          mise install
          # Every Linux asset must run on EL8 (glibc 2.28): a bump to a build that
          # needs a newer glibc fails here (fix: a musl github: asset, else conda:).
          WORKSTATION_GLIBC_FLOOR=2.28 bash tasks/verify-tools
          mb=$(( ($(du -sk "$h" | cut -f1) + 1023) / 1024 ))
          echo "linux: $mb MB" >>"$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/budget"
          echo "linux = $mb" >"$RUNNER_TEMP/budget/linux"
      - uses: actions/upload-artifact@v4
        with:
          name: budget-linux
          path: ${{ runner.temp }}/budget/linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
          install: false
          cache: false
      # Windows can't swap the home directory, so each place the install writes
      # is pointed under one measured root instead.
      - name: Install the toolbelt into empty directories and measure them
        shell: pwsh
        env:
          MISE_ENV: windows
          MISE_CONFIG_DIR: ${{ github.workspace }}
          MISE_LOCKFILE: "false"
          MISE_LOCKED: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'measure'
          $env:MISE_DATA_DIR = "$root\mise-data"
          $env:MISE_CACHE_DIR = "$root\mise-cache"
          $env:MISE_STATE_DIR = "$root\mise-state"
          $env:UV_CACHE_DIR = "$root\uv"
          $env:GOPATH = "$root\go"
          $env:GOCACHE = "$root\go-build"
          $env:npm_config_cache = "$root\npm"
          mise install
          if ($LASTEXITCODE -ne 0) { throw "mise install exited $LASTEXITCODE" }
          $bytes = (Get-ChildItem -LiteralPath $root -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          $mb = [math]::Ceiling($bytes / 1MB)
          "windows: $mb MB" | Add-Content $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'budget') | Out-Null
          "windows = $mb" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'budget\windows')
      - uses: actions/upload-artifact@v4
        with:
          name: budget-windows
          path: ${{ runner.temp }}/budget/windows

  commit:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: budget-*
          merge-multiple: true
          path: ${{ runner.temp }}/budget
      # Each figure is rounded up to the next 100 MB, so a few MB of cache noise
      # doesn't rewrite the file on every run. The Windows figure ends in CRLF.
      - name: Write disk-budget.toml
        run: |
          {
            echo '# Generated by .github/workflows/disk-budget.yml; never hand-edit. MB a fresh'
            echo '# `mise install` writes per OS (tools, downloads, uv/go/npm caches), rounded'
            echo '# up to 100 MB. Read by the free-space checks in scripts/lib/mise-install.sh (Linux)'
            echo '# and bootstrap.ps1 (Windows).'
            for k in linux windows; do
              mb=$(tr -d '\r' <"$RUNNER_TEMP/budget/$k" | sed -n "s/^$k = \([0-9][0-9]*\)\$/\1/p")
              [ -n "$mb" ] && [ "$mb" -gt 0 ] || { echo "no measurement for $k" >&2; exit 1; }
              echo "$k = $(( (mb + 99) / 100 * 100 ))"
            done
          } >disk-budget.toml
          { echo '```toml'; cat disk-budget.toml; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          git diff --stat -- disk-budget.toml
      - name: Commit to main
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- disk-budget.toml; then
            echo "disk-budget.toml unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(disk-budget): re-measure the toolbelt footprint' -- disk-budget.toml
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
