name: lint
on: [push, pull_request]

# All jobs only read the checkout — pin the token to least privilege.
permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
          install: false
          cache: true
      # mise 2026.9.9 rewrites lock files' sidecar refs to .mise/locks/ unless the config root is
      # literally $HOME/.config/mise (here it's MISE_CONFIG_DIR=$GITHUB_WORKSPACE), which would dirty
      # mise.linux.lock before check-invariants.sh asserts the locks/ layout. MISE_LOCKFILE=false skips
      # that rewrite; versions still come from config.linux.toml's pins, only checksum verification is off.
      - name: Install shfmt + gitleaks from the repo's own config (pins only, lockfile off)
        run: mise install shfmt gitleaks && shfmt --version && gitleaks version
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}
          MISE_ENV: linux
          MISE_LOCKFILE: "false"
      - name: Run invariant checks
        run: bash scripts/check-invariants.sh
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}
          MISE_ENV: linux
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./scripts/check-ps.ps1
  # Both Windows shells on one runner. `shell:` does NOT accept expressions
  # (a `${{ matrix.shell }}` matrix fails workflow validation with zero jobs),
  # so the two legs are explicit steps; `if: always()` makes the pwsh leg
  # report even when the 5.1 leg fails.
  windows-http:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test curl HTTP transport (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-curl.ps1
      - name: Test curl HTTP transport (pwsh)
        if: always()
        shell: pwsh
        run: ./scripts/test-curl.ps1
      - name: Test config.local.toml writer (Windows PowerShell 5.1)
        if: always()
        shell: powershell
        run: ./scripts/test-config-local.ps1
      - name: Test config.local.toml writer (pwsh)
        if: always()
        shell: pwsh
        run: ./scripts/test-config-local.ps1
  # jsdom here is a CI-ONLY behavioural check for README.html + README.js
  # (search titles, filter/anchor interaction, history) — NOT a fleet tool: no
  # config.toml pin, same precedent as the nushell syntax checker below.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install jsdom (pinned, CI-only)
        run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@30.0.1
      - name: Behavioural check of README.html + README.js
        run: node scripts/check-readme.mjs
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Only the mise BINARY is needed here — `mise dot apply`/`mise
      # bootstrap --only dotfiles` render into a throwaway $HOME and never
      # touch [tools] or a lockfile, so install:false (no tool installs) is
      # enough, same as the invariants job.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
          install: false
          cache: true
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      # nushell here is a CI-ONLY syntax checker for config.nu.tera — NOT a
      # fleet tool: no config.toml pin, deliberately NOT an enforced
      # dual-edit with bootstrap.ps1's Nushell pin (drift is harmless; this
      # only parses). Bump ad-hoc when the check needs newer syntax.
      - name: Install nushell (pinned, CI-only)
        run: |
          NU=0.113.1
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${NU}/nu-${NU}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/nu.tgz
          tar -xzf /tmp/nu.tgz -C /tmp
          sudo install -m 0755 /tmp/nu-${NU}-x86_64-unknown-linux-musl/nu /usr/local/bin/nu
          nu --version
      # pwsh needs no install step: ubuntu-latest ships it already (proven by
      # the `powershell` job above, which runs `shell: pwsh` with no pwsh
      # install of its own) — so no Windows runner leg is needed for the
      # PowerShell-profile template's syntax check either.
      - name: Render + syntax-check dotfiles templates
        run: bash scripts/check-templates.sh
