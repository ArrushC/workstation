name: lint
on: [push, pull_request]

# All jobs only read the checkout — pin the token to least privilege.
permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # shfmt + gitleaks pins are a DUAL-EDIT with makefile/versions.mk
      # (SHFMT_VERSION / GITLEAKS_VERSION); check-invariants.sh verifies they
      # match. They're installed here so the format/secret checks actually
      # enforce in CI (check-invariants soft-skips a missing tool).
      - name: Install shfmt + gitleaks (pinned)
        run: |
          SHFMT=3.14.0
          GITLEAKS=8.30.1
          sudo curl -fsSL "https://github.com/mvdan/sh/releases/download/v${SHFMT}/shfmt_v${SHFMT}_linux_amd64" -o /usr/local/bin/shfmt
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/shfmt /usr/local/bin/gitleaks
          shfmt --version && gitleaks version
      - name: Run invariant checks
        run: bash scripts/check-invariants.sh
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./scripts/check-ps.ps1
  # Both Windows shells on one runner. `shell:` does NOT accept expressions
  # (a `${{ matrix.shell }}` matrix fails workflow validation with zero jobs),
  # so the two legs are explicit steps; `if: always()` makes the pwsh leg
  # report even when the 5.1 leg fails.
  windows-http:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test curl HTTP transport (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-curl.ps1
      - name: Test curl HTTP transport (pwsh)
        if: always()
        shell: pwsh
        run: ./scripts/test-curl.ps1
  # jsdom here is a CI-ONLY behavioural check for README.html + README.js
  # (search titles, filter/anchor interaction, history) — NOT a fleet tool: no
  # versions.mk entry, same precedent as the nushell syntax checker below.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install jsdom (pinned, CI-only)
        run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@30.0.1
      - name: Behavioural check of README.html + README.js
        run: node scripts/check-readme.mjs
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      # nushell here is a CI-ONLY syntax checker for config.nu.tmpl — NOT a
      # fleet tool: no versions.mk entry, deliberately NOT an enforced
      # dual-edit with bootstrap.ps1's Nushell pin (drift is harmless; this
      # only parses). Bump ad-hoc when the check needs newer syntax.
      - name: Install nushell (pinned, CI-only)
        run: |
          NU=0.113.1
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${NU}/nu-${NU}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/nu.tgz
          tar -xzf /tmp/nu.tgz -C /tmp
          sudo install -m 0755 /tmp/nu-${NU}-x86_64-unknown-linux-musl/nu /usr/local/bin/nu
          nu --version
      - name: Render + syntax-check templates
        run: PATH="$HOME/.local/bin:$PATH" bash scripts/check-templates.sh
