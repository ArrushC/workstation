# =============================================================================
# roles/rhel-base/defaults/main.yml
# Default values — override in group_vars or host_vars as needed
# =============================================================================

install_system_packages: true
install_user_tools: true
apply_dotfiles: true

# Set to false if you don't have sudo on a particular VM
has_sudo: true

# Architecture — override for non-x86 machines
arch: "x86_64"
linux_target: "unknown-linux-musl"
