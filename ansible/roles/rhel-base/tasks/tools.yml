# =============================================================================
# roles/rhel-base/tasks/tools.yml
# User-space tools installed to ~/.local/bin — no sudo required
# =============================================================================

- name: "Ensure ~/.local/bin exists"
  ansible.builtin.file:
    path: "{{ dev_bin }}"
    state: directory
    mode: "0755"

# --- fzf ---------------------------------------------------------------------
- name: "Install fzf"
  ansible.builtin.unarchive:
    src: "https://github.com/junegunn/fzf/releases/download/v{{ fzf_version }}/fzf-{{ fzf_version }}-linux_amd64.tar.gz"
    dest: "{{ dev_bin }}"
    remote_src: true
    mode: "0755"
  args:
    creates: "{{ dev_bin }}/fzf"

# --- zoxide ------------------------------------------------------------------
- name: "Install zoxide"
  ansible.builtin.unarchive:
    src: "https://github.com/ajeetdsouza/zoxide/releases/download/v{{ zoxide_version }}/zoxide-{{ zoxide_version }}-{{ arch }}-{{ linux_target }}.tar.gz"
    dest: "{{ dev_bin }}"
    remote_src: true
    include:
      - zoxide
    mode: "0755"
  args:
    creates: "{{ dev_bin }}/zoxide"

# --- starship ----------------------------------------------------------------
- name: "Install starship"
  ansible.builtin.unarchive:
    src: "https://github.com/starship/starship/releases/download/v{{ starship_version }}/starship-{{ arch }}-{{ linux_target }}.tar.gz"
    dest: "{{ dev_bin }}"
    remote_src: true
    mode: "0755"
  args:
    creates: "{{ dev_bin }}/starship"

# --- zellij ------------------------------------------------------------------
- name: "Install zellij"
  ansible.builtin.unarchive:
    src: "https://github.com/zellij-org/zellij/releases/download/v{{ zellij_version }}/zellij-{{ arch }}-{{ linux_target }}.tar.gz"
    dest: "{{ dev_bin }}"
    remote_src: true
    mode: "0755"
  args:
    creates: "{{ dev_bin }}/zellij"

# --- glow --------------------------------------------------------------------
- name: "Install glow"
  ansible.builtin.unarchive:
    src: "https://github.com/charmbracelet/glow/releases/download/v{{ glow_version }}/glow_{{ glow_version }}_Linux_x86_64.tar.gz"
    dest: "{{ dev_bin }}"
    remote_src: true
    include:
      - glow
    mode: "0755"
  args:
    creates: "{{ dev_bin }}/glow"

# --- nb ----------------------------------------------------------------------
- name: "Install nb"
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/xwmx/nb/master/nb"
    dest: "{{ dev_bin }}/nb"
    mode: "0755"
  args:
    creates: "{{ dev_bin }}/nb"

# --- helix -------------------------------------------------------------------
- name: "Create helix temp dir"
  ansible.builtin.tempfile:
    state: directory
  register: helix_tmp

- name: "Download and extract helix"
  ansible.builtin.unarchive:
    src: "https://github.com/helix-editor/helix/releases/download/{{ helix_version }}/helix-{{ helix_version }}-{{ arch }}-linux.tar.xz"
    dest: "{{ helix_tmp.path }}"
    remote_src: true
  args:
    creates: "{{ dev_bin }}/hx"

- name: "Copy helix binary"
  ansible.builtin.copy:
    src: "{{ helix_tmp.path }}/helix-{{ helix_version }}-{{ arch }}-linux/hx"
    dest: "{{ dev_bin }}/hx"
    mode: "0755"
    remote_src: true
  args:
    creates: "{{ dev_bin }}/hx"

- name: "Copy helix runtime"
  ansible.builtin.copy:
    src: "{{ helix_tmp.path }}/helix-{{ helix_version }}-{{ arch }}-linux/runtime"
    dest: "{{ dev_home }}/.config/helix/runtime"
    remote_src: true
  args:
    creates: "{{ dev_home }}/.config/helix/runtime"

- name: "Clean up helix temp dir"
  ansible.builtin.file:
    path: "{{ helix_tmp.path }}"
    state: absent

# --- chezmoi -----------------------------------------------------------------
- name: "Install chezmoi"
  ansible.builtin.shell:
    cmd: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "{{ dev_bin }}"
    creates: "{{ dev_bin }}/chezmoi"
