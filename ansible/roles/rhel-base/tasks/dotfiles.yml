# =============================================================================
# roles/rhel-base/tasks/dotfiles.yml
# Applies dotfiles via chezmoi — runs as the dev user, no sudo
# =============================================================================

- name: "Check if chezmoi source dir already exists"
  ansible.builtin.stat:
    path: "{{ chezmoi_source }}/.git"
  register: chezmoi_source_stat

- name: "Init and apply chezmoi dotfiles (first run)"
  ansible.builtin.command:
    cmd: >
      {{ dev_bin }}/chezmoi init --apply
      --source {{ chezmoi_source }}
      {{ dotfiles_repo }}
  when: not chezmoi_source_stat.stat.exists
  environment:
    PATH: "{{ dev_bin }}:{{ ansible_env.PATH }}"

- name: "Update existing chezmoi dotfiles"
  ansible.builtin.command:
    cmd: "{{ dev_bin }}/chezmoi update --source {{ chezmoi_source }}"
  when: chezmoi_source_stat.stat.exists
  environment:
    PATH: "{{ dev_bin }}:{{ ansible_env.PATH }}"
