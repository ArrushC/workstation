# =============================================================================
# roles/rhel-base/tasks/shell.yml
# Ensures ~/.local/bin is on PATH in /etc/profile.d (system-wide, requires sudo)
# and sets up bash_completion
# =============================================================================

- name: "Add ~/.local/bin to system PATH via profile.d"
  ansible.builtin.copy:
    dest: /etc/profile.d/local-bin.sh
    content: |
      # Added by Ansible — workstation repo
      export PATH="$HOME/.local/bin:$PATH"
    mode: "0644"
  become: true
  when: has_sudo

# Fallback: inject into ~/.bashrc if no sudo
- name: "Ensure ~/.local/bin in PATH (no-sudo fallback)"
  ansible.builtin.lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    create: true
  when: not has_sudo

- name: "Ensure bash_completion is sourced"
  ansible.builtin.lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: '[[ -f /etc/bash_completion ]] && source /etc/bash_completion'
    create: true
