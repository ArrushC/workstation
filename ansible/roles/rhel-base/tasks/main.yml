# =============================================================================
# roles/rhel-base/tasks/main.yml
# Orchestrates all task files in order
# =============================================================================

- name: "Validate tool_scope vs has_sudo"
  ansible.builtin.fail:
    msg: "tool_scope=system requires has_sudo=true (system install needs root)"
  when: tool_scope == 'system' and not has_sudo

- name: "Resolve tool install paths from tool_scope"
  ansible.builtin.set_fact:
    tools_dest: "{{ '/usr/local/bin' if tool_scope == 'system' else dev_bin }}"
    tools_become: "{{ tool_scope == 'system' }}"
    helix_runtime_dest: "{{ '/usr/local/lib/helix' if tool_scope == 'system' else (dev_home + '/.config/helix') }}"

- name: "System packages"
  import_tasks: packages.yml
  when: install_system_packages and has_sudo
  become: true

- name: "User-space tools"
  import_tasks: tools.yml
  when: install_user_tools

- name: "Shell configuration"
  import_tasks: shell.yml

- name: "Dotfiles via chezmoi"
  import_tasks: dotfiles.yml
  when: apply_dotfiles
