# =============================================================================
# roles/linux-base/defaults/main.yml
# Default values — override in group_vars or host_vars as needed
# =============================================================================

install_system_packages: true
install_user_tools: true
apply_dotfiles: true

# Set to false if you don't have sudo on a particular host
has_sudo: true

# Where user-space tools (fzf, zoxide, helix, etc.) get installed:
#   user   → ~/.local/bin            (no sudo, per-user)
#   system → /usr/local/bin          (requires sudo, available system-wide)
# Both modes install the same static binaries — only the destination differs.
tool_scope: user

# Architecture — override for non-x86 machines
arch: "x86_64"
linux_target: "unknown-linux-musl"
