# =============================================================================
# roles/linux-base/tasks/dotfiles.yml
# Applies dotfiles via chezmoi — runs as the dev user, no sudo.
# Uses tools_dest (resolved in main.yml) to find the chezmoi binary, falling
# back to dev_bin if tools.yml didn't run.
#
# Gated on chezmoi CONFIG existence, not source-dir existence:
#   - bootstrap.sh always clones the source before invoking Ansible, so
#     "source missing" is never the actual first-run signal.
#   - The real first-run signal is "no ~/.config/chezmoi/chezmoi.toml yet,"
#     i.e. `chezmoi init` was never successfully run (its config-generation
#     step depends on promptStringOnce for name/email, which can't run from
#     Ansible's command module — no TTY for prompts).
#
# So we ONLY run `chezmoi update` here, and only when the config file
# already exists. The interactive first-run init is handled by
# bootstrap.sh's ensure_chezmoi_initialized() function (which has TTY
# access via /dev/tty) — see bootstrap.sh, step 5b.
# =============================================================================

- name: "Resolve chezmoi binary path"
  ansible.builtin.set_fact:
    chezmoi_bin: "{{ tools_dest | default(dev_bin) }}/chezmoi"

- name: "Check if chezmoi config exists (proxy for: has init succeeded?)"
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/chezmoi/chezmoi.toml"
  register: chezmoi_config_stat

- name: "Update existing chezmoi dotfiles"
  ansible.builtin.command:
    cmd: "{{ chezmoi_bin }} update --source {{ chezmoi_source }}"
  when: chezmoi_config_stat.stat.exists
  environment:
    PATH: "{{ tools_dest | default(dev_bin) }}:{{ dev_bin }}:{{ ansible_env.PATH }}"

- name: "Note: deferring chezmoi init to bootstrap.sh (no config yet)"
  ansible.builtin.debug:
    msg: |
      No chezmoi config at ~/.config/chezmoi/chezmoi.toml — skipping
      `chezmoi update`. bootstrap.sh's ensure_chezmoi_initialized step
      runs `chezmoi init --apply` interactively after this playbook
      and prompts for name/email. Subsequent bootstrap runs will see
      the config and `chezmoi update` will run here.
  when: not chezmoi_config_stat.stat.exists
