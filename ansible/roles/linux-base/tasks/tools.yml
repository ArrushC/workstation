# =============================================================================
# roles/linux-base/tasks/tools.yml
# Static-binary tool installs — delegated to scripts/install/Makefile.
#
# Tool versions, URLs, and per-tool quirks (./prefix tarballs, wrapper
# directories, multi-binary archives, etc.) all live under
# scripts/install/. This file is just the orchestration shim that:
#   1. Ensures the install destination exists,
#   2. Runs `make all` for scope-aware tools (under become per tool_scope),
#   3. Runs `make user-tools` for pip tools (always as the dev user),
#   4. Runs `make claude-cli` on dev_machine hosts (Claude Code CLI).
#
# The Makefile invokes lib/*.sh helpers in parallel via `-j`, and stamps
# each successful install at $(STAMP) so re-runs are no-ops. To add a
# tool, edit scripts/install/{versions,tools}.mk — Ansible needs no change.
#
# tools_dest, tools_become, and helix_runtime_dest come from main.yml's
# scope resolution.
# =============================================================================

- name: "Ensure tool install directory exists"
  ansible.builtin.file:
    path: "{{ tools_dest }}"
    state: directory
    mode: "0755"
  become: "{{ tools_become }}"

- name: "Ensure helix runtime parent directory exists"
  ansible.builtin.file:
    path: "{{ helix_runtime_dest }}"
    state: directory
    mode: "0755"
  become: "{{ tools_become }}"

# --- Scope-aware tools (fzf, gitui, helix, … ~55 binaries) -------------------
# Runs the Makefile's `all` target under become when tool_scope=='system'
# (so /usr/local/bin is writable). User scope skips become; DEST defaults
# to ~/.local/bin per the Makefile.
- name: "Install scope-aware tools via Makefile (parallel)"
  ansible.builtin.command:
    cmd: >-
      make -C {{ chezmoi_source }}/scripts/install
      -j{{ make_jobs | default(8) }}
      all
      DEST={{ tools_dest }}
      HELIX_RUNTIME_DEST={{ helix_runtime_dest }}
  become: "{{ tools_become }}"
  register: make_scope_result
  changed_when: "'==>' in make_scope_result.stdout"

# --- User tools (pip --user: glances, asciinema, harlequin) ------------------
# Always runs as the dev user. pip --user lands in ~/.local regardless of
# tool_scope, so installing under sudo would write to /root/.local and
# break things — hence the explicit `become: false`.
- name: "Install pip user tools via Makefile"
  ansible.builtin.command:
    cmd: >-
      make -C {{ chezmoi_source }}/scripts/install
      -j{{ make_jobs | default(4) }}
      user-tools
  become: false
  register: make_user_result
  changed_when: "'==>' in make_user_result.stdout"

# --- Claude Code CLI (dev_machine only) --------------------------------------
# Official upstream installer lands the binary in the dev user's
# ~/.local/bin regardless of scope. Gated by tool_scope=='system' to
# preserve the historical "dev_machine only" behavior from the per-tool
# YAML task.
- name: "Install claude (Claude Code CLI)"
  ansible.builtin.command:
    cmd: "make -C {{ chezmoi_source }}/scripts/install claude-cli"
  when: tool_scope == 'system'
  become: false
  register: make_claude_result
  changed_when: "'==>' in make_claude_result.stdout"
