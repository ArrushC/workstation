- name: "Install k9s"
  ansible.builtin.unarchive:
    src: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_Linux_amd64.tar.gz"
    dest: "{{ tools_dest }}"
    remote_src: true
    include:
      - k9s
    mode: "0755"
  args:
    creates: "{{ tools_dest }}/k9s"
  become: "{{ tools_become }}"

# --- rclone (rclone/rclone) — cloud storage sync ----------------------------
- name: "Install rclone"
  ansible.builtin.shell:
    cmd: |
      set -e
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      curl -fL -o "$tmp/rclone.zip" "https://github.com/rclone/rclone/releases/download/v{{ rclone_version }}/rclone-v{{ rclone_version }}-linux-amd64.zip"
      unzip -q "$tmp/rclone.zip" -d "$tmp"
      install -m 0755 "$(find "$tmp" -name rclone -type f | head -1)" "{{ tools_dest }}/rclone"
    creates: "{{ tools_dest }}/rclone"
  become: "{{ tools_become }}"

