# Static musl binary with all decoders built in — no system codec deps.
- name: "Install ouch"
  ansible.builtin.shell:
    cmd: |
      set -e
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      curl -fL "https://github.com/ouch-org/ouch/releases/download/{{ ouch_version }}/ouch-x86_64-unknown-linux-musl.tar.gz" | tar -xzf - -C "$tmp"
      install -m 0755 "$(find "$tmp" -name ouch -type f | head -1)" "{{ tools_dest }}/ouch"
    creates: "{{ tools_dest }}/ouch"
  become: "{{ tools_become }}"

