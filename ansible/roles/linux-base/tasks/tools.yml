# --- ssh-copy-id (upstream openssh-portable script) --------------------------
# Most RHEL hosts already ship this via openssh-clients; we install our own
# copy at tools_dest so prod_machine (no sudo, no openssh-clients install path)
# gets a working copy too.
- name: "Install ssh-copy-id"
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/openssh/openssh-portable/master/contrib/ssh-copy-id"
    dest: "{{ tools_dest }}/ssh-copy-id"
    mode: "0755"
  args:
    creates: "{{ tools_dest }}/ssh-copy-id"
  become: "{{ tools_become }}"

