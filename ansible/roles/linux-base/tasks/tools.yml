# --- Python tools via pip --user --------------------------------------------
# Python-based tools without clean standalone binary distributions. pip --user
# writes to ~/.local/bin/<binary> regardless of scope (it's the running user's
# home, not root's), so the same task path works in both dev and prod modes.
# Run as the dev_user (no become), and only on systems that have python3 + pip.
- name: "Install Python tools via pip --user"
  ansible.builtin.pip:
    name:
      - glances
      - asciinema
      - harlequin
    extra_args: --user
    state: present
  become: false

# --- claude (Claude Code CLI — dev_machine only) ----------------------------
# Tier-4: official upstream installer (curl | bash) — no Node.js / npm needed.
# The installer is user-scope by default (lands in ~/.local/bin/claude), so
# this runs as the dev_user without become. Gated by tool_scope='system' to
# keep claude off prod hosts per the user's requirement.
- name: "Install claude"
  ansible.builtin.shell:
    cmd: curl -fsSL https://claude.ai/install.sh | bash
    creates: "{{ dev_home }}/.local/bin/claude"
  when: tool_scope == 'system'
  become: false
