# =============================================================================
# roles/linux-base/tasks/packages.yml
# System-level packages via the OS package manager — requires sudo.
# ansible.builtin.package dispatches to dnf/apt/pacman/... based on
# ansible_pkg_mgr fact detection. Package names in group_vars/all.yml are
# RHEL/Fedora-flavored today; override per-host (or per-group) if you add a
# host on a different distro.
# =============================================================================

- name: "Ensure core packages are installed"
  ansible.builtin.package:
    name: "{{ linux_packages }}"
    state: present

# Many entries in linux_optional_packages (ripgrep, htop, pv, entr, parallel,
# shellcheck, ...) are EPEL-only on RHEL/Rocky/Alma. epel-release lives in the
# default `extras` repo on EL 8/9, so a plain `package` install picks it up.
# Fedora has these packages in its base repos and rejects epel-release, so
# skip there. ignore_errors=true so a misconfigured RHEL host without extras
# enabled doesn't brick the playbook — the downstream optional task is best-
# effort anyway.
- name: "Enable EPEL (RHEL/Rocky/Alma — needed for ripgrep, htop, pv, entr, shellcheck, …)"
  ansible.builtin.package:
    name: epel-release
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'Fedora'
  ignore_errors: true

- name: "Attempt optional packages (non-fatal if unavailable)"
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ linux_optional_packages }}"
  ignore_errors: true

- name: "Ensure ~/.local/bin exists"
  ansible.builtin.file:
    path: "{{ dev_bin }}"
    state: directory
    owner: "{{ dev_user }}"
    mode: "0755"
