# =============================================================================
# group_vars/all.yml — variables shared across all hosts
# =============================================================================

# --- User config -------------------------------------------------------------
dev_user: arrush.chaturvedi
dev_home: "/home/{{ dev_user }}"
dev_bin: "{{ dev_home }}/.local/bin"

# --- Dotfiles ----------------------------------------------------------------
dotfiles_repo: "https://github.com/ArrushC/workstation.git"
chezmoi_source: "{{ dev_home }}/.local/share/chezmoi"

# --- System packages to install (requires sudo) ------------------------------
# Installed via the distro's package manager (dnf on RHEL/Fedora today; the
# ansible.builtin.package module dispatches to whatever pkg manager Ansible
# detects). Add anything your dev workflow needs at the system level — things
# that can't be covered by static binaries in ~/.local/bin.
linux_packages:
  - git
  - curl
  - wget
  - unzip
  - tar
  - make
  - gcc
  - openssl-devel
  - python3
  - python3-pip

# --- Optional packages (comment out if not available on your distro) --------
# Best-effort: ansible.builtin.package with ignore_errors=true (see packages.yml),
# so missing repos / missing EPEL just produces a warning instead of failing.
# Dev-only — prod_machine sets install_system_packages=false and skips all of this.
linux_optional_packages:
  - ripgrep         # rg — used by fzf for file search
  - bash-completion
  # --- TUI / system monitoring (no portable static distribution) ------------
  - htop
  - multitail
  - goaccess
  # --- Networking (no portable static distribution) -------------------------
  - nmap
  - mtr
  # --- Shell / dev (no portable static distribution) -----------------------
  - zsh
  - parallel
  - pv
  - entr
  - tree
  - strace
  - perf
  - cronie
  - time
  # --- Universal CLI utilities (defense-in-depth — usually pre-installed) --
  - rsync
  - vim-common      # provides `xxd` (and ex, view, rvim helpers)
  # --- Quality / debugging (gap-filler additions) --------------------------
  - shellcheck      # lints bash scripts (bootstrap.sh, manage-hosts.sh, etc.)
  - gdb             # debugger for compiled code
  - lsof            # list open files / sockets (usually pre-installed)
  - tcpdump         # packet inspection

