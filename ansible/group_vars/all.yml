# =============================================================================
# group_vars/all.yml — variables shared across all VMs
# =============================================================================

# --- User config -------------------------------------------------------------
dev_user: arrush.chaturvedi
dev_home: "/home/{{ dev_user }}"
dev_bin: "{{ dev_home }}/.local/bin"

# --- Dotfiles ----------------------------------------------------------------
dotfiles_repo: "https://github.com/ArrushC/workstation.git"
chezmoi_source: "{{ dev_home }}/.local/share/chezmoi"

# --- System packages to install (requires sudo) ------------------------------
# These are installed via dnf. Add anything your dev workflow needs at the
# system level — things that can't be covered by static binaries in ~/.local/bin
rhel_packages:
  - git
  - curl
  - wget
  - unzip
  - tar
  - make
  - gcc
  - openssl-devel
  - python3
  - python3-pip

# --- Optional packages (comment out if not available on your RHEL version) --
rhel_optional_packages:
  - ripgrep       # rg — used by fzf for file search
  - fd-find       # fd — faster find alternative
  - bash-completion

# --- Tool versions (keep in sync with bootstrap.sh) -------------------------
fzf_version: "0.54.0"
zoxide_version: "0.9.4"
starship_version: "1.19.0"
zellij_version: "0.40.1"
glow_version: "1.5.1"
helix_version: "24.03"
chezmoi_version: "latest"
