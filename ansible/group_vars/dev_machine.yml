# =============================================================================
# group_vars/dev_machine.yml — variables for hosts you own (sudo available)
# =============================================================================
# Single source of truth for the dev-machine scope. Loaded automatically when
# Ansible runs against any host in the [dev_machine] inventory group, and
# loaded by bootstrap.sh for the local self-provisioning flow via
#   ansible-playbook playbooks/local.yml -e "@group_vars/dev_machine.yml"
# Keep this file aligned with bootstrap.sh's --dev branch.
# =============================================================================

tool_scope: system
has_sudo: true
install_system_packages: true
