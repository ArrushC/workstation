# =============================================================================
# ansible/playbooks/linux.yml — main playbook
# Provisions managed Linux hosts (dev_machine + prod_machine) and applies
# dotfiles. Scope (tool_scope, has_sudo, install_system_packages) is set per
# host from group_vars/dev_machine.yml and group_vars/prod_machine.yml.
#
# Usage:
#   All managed hosts:
#     ansible-playbook -i inventory/hosts.ini playbooks/linux.yml --ask-become-pass
#
#   Single group:
#     ansible-playbook -i inventory/hosts.ini playbooks/linux.yml --limit dev_machine --ask-become-pass
#     ansible-playbook -i inventory/hosts.ini playbooks/linux.yml --limit prod_machine
#
#   Single host:
#     ansible-playbook -i inventory/hosts.ini playbooks/linux.yml --limit atc-cache-dev09
#
#   Dry run (see what would change):
#     ansible-playbook -i inventory/hosts.ini playbooks/linux.yml --check
# =============================================================================

- name: "Provision managed Linux hosts"
  hosts: dev_machine:prod_machine
  gather_facts: true

  roles:
    - linux-base
