# =============================================================================
# ansible/playbooks/local.yml — self-provisioning
# Runs the linux-base role against the machine you're sitting on.
# Used by bootstrap.sh; scope comes from the group_vars file passed via -e.
#
# Usage (typically invoked via bootstrap.sh):
#   prod_machine (no sudo, ~/.local/bin):
#     ansible-playbook playbooks/local.yml -e "@group_vars/prod_machine.yml"
#
#   dev_machine (sudo, /usr/local/bin + system packages):
#     ansible-playbook playbooks/local.yml \
#       -e "@group_vars/dev_machine.yml" --ask-become-pass
# =============================================================================

- name: "Provision the local machine"
  hosts: localhost
  connection: local
  gather_facts: true

  roles:
    - linux-base
