# =============================================================================
# ansible/ansible.cfg
# Local config — only applies when running ansible from the ansible/ directory
# =============================================================================

[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
host_key_checking  = False
retry_files_enabled = False
gathering          = smart
# stdout_callback intentionally not set — uses ansible.builtin.default.
# The prettier yaml callback lives in community.general, which (a) ships
# version-mismatched against ansible-core 2.15.x (the Python 3.9 ceiling
# on RHEL 9), and (b) needs the Galaxy API path that ansible-core 2.15.x
# can't parse. Not worth the bootstrap fragility for a stylistic choice.

# Speed up SSH connections
[ssh_connection]
pipelining         = True
control_path       = /tmp/ansible-ssh-%%h-%%p-%%r
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s
