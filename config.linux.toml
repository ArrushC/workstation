# config.linux.toml: the Linux toolbelt, both modes (loads when MISE_ENV has `linux`).
# Installed user-level under ~/.local/share/mise; interactive shells get the real bin
# dirs via `mise activate`, everything else the shims.
[tools]
# --- aqua registry (short names) ---
fzf = "0.74.4"
zoxide = "0.10.0"
starship = "1.26.0"
zellij = "0.45.1"
glow = "3.0.0"
helix = "25.07.1"          # archive carries runtime/ beside hx — no HELIX_RUNTIME needed
fd = "10.5.0"
bat = "0.26.1"
btop = "1.4.7"
jq = "1.8.2"
yq = "4.53.6"
witr = "0.3.3"
lazydocker = "0.25.2"
dive = "0.13.1"
lnav = "0.14.1"
gopass = "1.17.3"
age = "1.3.2"
gitui = "0.28.1"
lazygit = "0.65.1"
jj = "0.45.1"
ast-grep = "0.45.3"
xh = "0.26.2"
delta = "0.19.2"
micro = "2.0.15"
eza = "0.23.5"
sd = "1.1.0"
ctop = "0.7.7"
k9s = "0.51.0"
rclone = "1.75.1"
croc = "11.5.4"
hyperfine = "1.20.0"
gh = "2.101.0"
sops = "3.13.3"
htmlq = "0.4.0"
watchexec = "2.7.3"
bottom = "0.14.9"
systemctl-tui = "0.8.0"
lazyjournal = "0.8.6"
cheat = "5.1.0"
fx = "39.2.0"
ripgrep = "15.2.0"
miller = "6.22.0"
doggo = "1.4.0"
miniserve = "0.35.0"
numbat = "1.24.0"
grex = "1.4.6"
shfmt = "3.14.1"
gitleaks = "8.30.1"
dust = "1.2.6"
hexyl = "0.17.0"
gum = "2.0.2"
rust-analyzer = "2026-09-21"
marksman = "2026-02-08"
taplo = "0.10.0"
# --- github: (registry entry absent or picks the wrong asset for EL9) ---
"github:xo/usql" = { version = "0.21.6", asset_pattern = "usql_static-{{version}}-linux-amd64.tar.bz2", rename_exe = { "usql_static" = "usql" } }   # dynamic build needs glibc 2.38
"github:fastfetch-cli/fastfetch" = { version = "2.69.0", asset_pattern = "fastfetch-linux-amd64-polyfilled.tar.gz" }   # plain build's loader fails on EL9
"github:dalance/procs" = { version = "0.14.12", asset_pattern = "procs-v{{version}}-x86_64-linux.zip" }
"github:imsnif/bandwhich" = { version = "0.23.1", asset_pattern = "bandwhich-v{{version}}-x86_64-unknown-linux-musl.tar.gz" }
"github:tealdeer-rs/tealdeer" = { version = "1.9.0", asset_pattern = "tealdeer-linux-x86_64-musl", bin = "tldr" }
"github:jarun/nnn" = { version = "5.3", asset_pattern = "nnn-musl-static-{{version}}.x86_64.tar.gz", rename_exe = { "nnn-musl-static" = "nnn" } }
"github:YS-L/csvlens" = { version = "0.15.1", asset_pattern = "csvlens-x86_64-unknown-linux-musl.tar.xz" }
"github:fujiapple852/trippy" = { version = "0.13.0", asset_pattern = "trippy-{{version}}-x86_64-unknown-linux-musl.tar.gz" }   # binary is `trip`
"github:tummychow/git-absorb" = { version = "0.9.0", asset_pattern = "git-absorb-{{version}}-x86_64-unknown-linux-musl.tar.gz" }
"github:ouch-org/ouch" = { version = "0.8.3", asset_pattern = "ouch-x86_64-unknown-linux-musl.tar.gz" }   # 0.8.3+ signs with cosign, not GitHub attestations, so mise reads bumps as a provenance downgrade; verified by hand with cosign verify-blob
"github:boyter/scc" = { version = "4.1.0", asset_pattern = "scc_Linux_x86_64.tar.gz" }
"github:multiprocessio/dsq" = { version = "0.23.0" }
"github:unhappychoice/gitlogue" = { version = "0.11.0" }
"github:PaulJuliusMartinez/jless" = { version = "0.9.0", asset_pattern = "jless-v{{version}}-x86_64-unknown-linux-gnu.zip" }
"github:Canop/broot" = { version = "1.60.2", asset_pattern = "broot_{{version}}.zip", bin_path = "x86_64-unknown-linux-musl" }
"github:al13n321/nnd" = { version = "0.80", asset_pattern = "nnd" }
"github:orf/gping" = { version = "1.21.0", version_prefix = "gping-v", asset_pattern = "gping-Linux-musl-x86_64.tar.gz" }   # aqua defaults to gnu (GLIBC_2.39 > EL9's 2.34); pin musl
"github:sxyazi/yazi" = { version = "26.9.1", asset_pattern = "yazi-x86_64-unknown-linux-musl.zip" }   # aqua defaults to gnu (GLIBC_2.39 > EL9's 2.34); pin musl; ships yazi + ya
"github:alexpasmantier/television" = { version = "0.15.9", asset_pattern = "tv-{{version}}-x86_64-unknown-linux-musl.tar.gz" }   # aqua defaults to gnu (GLIBC_2.39 > EL9's 2.34); pin musl; binary is `tv`
"github:atuinsh/atuin" = { version = "18.23.0", asset_pattern = "atuin-x86_64-unknown-linux-musl.tar.gz" }   # aqua defaults to gnu (GLIBC_2.38 > EL9's 2.34); pin musl
"github:Wilfred/difftastic" = { version = "0.71.0" }   # aqua can't resolve 0.71.0+ (asset names gained a version prefix); github: autodetects both
"github:dathere/qsv" = { version = "23.0.1", asset_pattern = "qsv-{{version}}-x86_64-unknown-linux-musl.zip", bin = "qsv" }   # aqua defaults to gnu (GLIBCXX_3.4.30 > EL9's floor); pin musl; bin= picks the full-feature binary of 6
"github:dj95/zjstatus" = { version = "0.25.0", asset_pattern = "zjstatus.wasm" }   # copied into zellij's data dir by scripts/lib/zellij-plugin.sh (tasks/bootstrap)
# --- http: (no GitHub release, bare assets, or scripts) ---
"http:ncdu" = { version = "2.9.1", url = "https://dev.yorhel.nl/download/ncdu-{{version}}-linux-x86_64.tar.gz" }
"http:pueue" = { version = "4.0.4", url = "https://github.com/Nukesor/pueue/releases/download/v{{version}}/pueue-x86_64-unknown-linux-musl", bin = "pueue" }
"http:pueued" = { version = "4.0.4", url = "https://github.com/Nukesor/pueue/releases/download/v{{version}}/pueued-x86_64-unknown-linux-musl", bin = "pueued" }
"http:nb" = { version = "7.25.5", url = "https://raw.githubusercontent.com/xwmx/nb/{{version}}/nb", bin = "nb" }
"http:sysz" = { version = "1.4.3", url = "https://raw.githubusercontent.com/joehillen/sysz/{{version}}/sysz", bin = "sysz" }
# The OpenSSH tag in the URL is hard-coded: bump it with `version` (10.6p1 -> V_10_6_P1).
"http:ssh-copy-id" = { version = "10.5p1", url = "https://raw.githubusercontent.com/openssh/openssh-portable/V_10_5_P1/contrib/ssh-copy-id", bin = "ssh-copy-id" }
# Rolling raw script with no release or {{version}} in the URL; the http: backend
# rejects "latest", so version = "0" is a placeholder.
"http:cht.sh" = { version = "0", url = "https://cht.sh/:cht.sh", bin = "cht.sh" }
# --- pypi: (latest at install time, pinned by mise.lock) ---
"pypi:glances" = "latest"
"pypi:asciinema" = "latest"
"pypi:harlequin" = "latest"

# ---------------------------------------------------------------------------
# Dotfiles for Linux, both modes (no owned gate: owned-only targets are in
# config.owned.toml, Linux-owned-only in config.host.toml, Windows in
# config.windows.toml, cross-platform in config.toml). Directory entries keep
# exclude = [".vendor", ".gitkeep"] so provenance sidecars and placeholders never
# land in $HOME; copy on a directory leaves unmanaged siblings alone.
# ---------------------------------------------------------------------------
[dotfiles]
# Shell rc files.
"~/.bashrc" = { source = "dotfiles/bashrc.tera", mode = "template" }
"~/.zshrc" = { source = "dotfiles/zshrc.tera", mode = "template" }
"~/.zshenv" = { source = "dotfiles/zshenv.tera", mode = "template" }
"~/.dircolors" = { source = "dotfiles/dircolors", mode = "copy" }
"~/.nbrc" = { source = "dotfiles/nbrc", mode = "copy" }

"~/.config/bash/completions.bash" = { source = "dotfiles/config/bash/completions.bash", mode = "copy" }
"~/.config/cheat/conf.yml" = { source = "dotfiles/config/cheat/conf.yml.tera", mode = "template" }
"~/.config/cheat/cheatsheets/personal/workstation" = { source = "dotfiles/config/cheat/cheatsheets/personal/workstation", mode = "copy" }
"~/.config/tealdeer/config.toml" = { source = "dotfiles/config/tealdeer/config.toml", mode = "copy" }
# Single Helix source for both OSes: the Windows template
# (dotfiles/windows/AppData/Roaming/helix/config.toml.tera) read_file()-inlines it.
# Linux-only here because Windows reads %APPDATA%\helix, not ~/.config/helix.
"~/.config/helix/config.toml" = { source = "dotfiles/config/helix/config.toml", mode = "copy" }
"~/.config/zellij" = { source = "dotfiles/config/zellij", mode = "copy", exclude = [".vendor", ".gitkeep"] }   # layouts/, themes/ nested
"~/.config/zsh/completions" = { source = "dotfiles/config/zsh/completions", mode = "copy", exclude = [".vendor", ".gitkeep"] }   # unmanaged completions (e.g. _workstation) survive

# zsh plugin dirs — all vendored, all carry a .vendor provenance sidecar that
# must never itself land under ~/.config/zsh/plugins/*.
"~/.config/zsh/plugins/fzf-tab" = { source = "dotfiles/config/zsh/plugins/fzf-tab", mode = "copy", exclude = [".vendor", ".gitkeep"] }
"~/.config/zsh/plugins/zsh-autosuggestions" = { source = "dotfiles/config/zsh/plugins/zsh-autosuggestions", mode = "copy", exclude = [".vendor", ".gitkeep"] }
"~/.config/zsh/plugins/zsh-history-substring-search" = { source = "dotfiles/config/zsh/plugins/zsh-history-substring-search", mode = "copy", exclude = [".vendor", ".gitkeep"] }
"~/.config/zsh/plugins/zsh-syntax-highlighting" = { source = "dotfiles/config/zsh/plugins/zsh-syntax-highlighting", mode = "copy", exclude = [".vendor", ".gitkeep"] }
"~/.config/zsh/plugins/zsh-you-should-use" = { source = "dotfiles/config/zsh/plugins/zsh-you-should-use", mode = "copy", exclude = [".vendor", ".gitkeep"] }
# Single vendored file — provenance is in its own header, no separate .vendor sidecar.
"~/.config/zsh/plugins/zsh-shift-select.zsh" = { source = "dotfiles/config/zsh/plugins/zsh-shift-select.zsh", mode = "copy" }

# batpipe + winterop, both executable (git mode 755); .vendor sidecar excluded.
"~/.local/bin" = { source = "dotfiles/local/bin", mode = "copy", exclude = [".vendor", ".gitkeep"] }

# ---------------------------------------------------------------------------
# Host state that needs no sudo (both modes). Sudo-requiring state lives in
# config.host.toml / config.native.toml / config.wsl.toml (owned-only tokens).
# ---------------------------------------------------------------------------
[bootstrap.hooks]
# Capability gate over every mise-installed Linux binary (scripts/lib/verify-binary.sh).
"post-tools" = "mise run verify-tools"
# Restores the ~/.ssh and ~/.claude directory modes that copy/template can't express
# (they propagate the source file's own bits, and git tracks only the executable
# bit). This is the only guarantee of the SSH security posture, so it must never fail
# the bootstrap. mise runs hooks under `sh -o errexit`, which aborts at the first
# failing command in a `;` chain (e.g. ~/.claude missing on a shared host), so each
# command carries its own `|| true`. The third chmod sets the SOURCE to 0600 too:
# mise compares target mode to source mode, so a 0644 source leaves ~/.ssh/config
# permanently "differs (permissions differ)". mise has no per-entry mode key, and
# `private = true` is ignored.
"post-dotfiles" = "chmod 700 ~/.ssh ~/.claude 2>/dev/null || true; chmod 600 ~/.ssh/config 2>/dev/null || true; chmod 600 ~/.config/mise/dotfiles/ssh/config.tera 2>/dev/null || true"

# pueued: mise writes ~/.config/systemd/user/dev.mise.pueued.service and enables
# it. systemd expands %h in ExecStart; the shim picks its config set from
# ~/.config/mise/miserc.toml (written by scripts/lib/mise-env.sh), so no
# Environment= line is needed.
[bootstrap.services.pueued]
scope = "user"
command = "%h/.local/share/mise/shims/pueued -v"
restart = "on-failure"
requires_tools = true
enabled = true
state = "running"
