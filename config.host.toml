# config.host.toml: Linux owned host state (MISE_ENV token `host`). Loaded only on
# owned hosts (linux,owned,host,{wsl|native}); shared hosts never see it, so nothing
# here may need sudo there. mise requests sudo itself for the dnf batch and hooks.

[bootstrap.hooks]
# EPEL + CRB must exist before the dnf batch resolves (ripgrep/htop/cppcheck/
# heaptrack/bear/ccache are EPEL, meson/ninja-build are CRB). mise has no repo-enabling
# key, so this is a hook task. Hooks are always `mise run <task>` (opaque strings
# get no verified cwd/PATH).
"pre-packages" = "mise run enable-el-repos"
# Owned-only steps run from here, so shared hosts (which never load this file)
# never see them. `final` runs only on a full `mise bootstrap`, never on
# `--only dotfiles` (wsa).
"final" = "mise run vcpkg ::: claude"

[bootstrap.packages]
# ONE `sudo dnf install -y <every missing name>` per run: a single unresolvable name
# fails the whole batch, so every name is EL9-verified. Do not add fswatch/entr (not
# packaged for EL9) or cockpit-networkmanager (a virtual provide `rpm -q` never sees).
# `make` stays as a C-toolchain dependency. NFS lives in config.native.toml.
# --- core ---
"dnf:curl" = "latest"
"dnf:gcc" = "latest"
"dnf:git" = "latest"
"dnf:libatomic" = "latest"          # node >=25 links libatomic.so.1 (BaseOS); without it node/ccstatusline die at startup
"dnf:make" = "latest"
"dnf:ncurses" = "latest"
"dnf:openssl-devel" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"dnf:python3" = "latest"
"dnf:python3-pip" = "latest"
"dnf:tar" = "latest"
"dnf:unzip" = "latest"
"dnf:wget" = "latest"
"dnf:zsh" = "latest"
# --- optional ---
"dnf:ShellCheck" = "latest"          # EPEL capitalises it
"dnf:bash-completion" = "latest"
"dnf:bear" = "latest"
"dnf:bind-utils" = "latest"
"dnf:ccache" = "latest"
"dnf:clang" = "latest"
"dnf:clang-tools-extra" = "latest"
"dnf:cmake" = "latest"
"dnf:cppcheck" = "latest"
"dnf:cronie" = "latest"
"dnf:gcc-c++" = "latest"
"dnf:gdb" = "latest"
"dnf:gdb-gdbserver" = "latest"
"dnf:goaccess" = "latest"
"dnf:heaptrack" = "latest"
"dnf:htop" = "latest"
"dnf:info" = "latest"
"dnf:inotify-tools" = "latest"
"dnf:libasan" = "latest"
