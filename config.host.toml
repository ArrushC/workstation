# ~/.config/mise/config.host.toml — Linux DEV host state (MISE_ENV token `host`).
# Loaded only on dev hosts (linux,dev,host,{wsl|native}); prod hosts never see it,
# so nothing here may be needed without sudo. Sudo is requested by mise itself,
# by default (no repo setting — mise's dnf backend re-execs itself with sudo
# unconditionally), for the dnf batch and by the hook task.

[bootstrap.hooks]
# EPEL + CRB must exist before the dnf batch below resolves (ripgrep/htop/cppcheck/
# heaptrack/bear/ccache are EPEL, meson/ninja-build are CRB). mise has no repo-
# enabling key, so this stays a shell step — always `mise run <task>` (tasks are
# discovered from any cwd and run with tools on PATH; hook strings themselves are
# opaque to mise). Hook names are unique across config files (merge is unverified).
"pre-packages" = "mise run enable-el-repos"

[bootstrap.packages]
# ONE `sudo dnf install -y <every missing name>` per run — a single unresolvable
# name fails the whole batch, so every name here is EL9-verified (dnf repoquery,
# AlmaLinux 9.8, 2026-09-17). Gone from the Make-era list: fswatch + entr (not
# packaged for EL9), cockpit-networkmanager (virtual provide of cockpit-system,
# `rpm -q` never sees it). `make` stays: it is a C-toolchain dependency, not our
# orchestrator any more. NFS lives in config.native.toml (WSL skips it).
# --- core (the old LINUX_PACKAGES) ---
"dnf:curl" = "latest"
"dnf:gcc" = "latest"
"dnf:git" = "latest"
"dnf:libatomic" = "latest"          # node >=25 links libatomic.so.1 (BaseOS); without it node/ccstatusline die at startup
"dnf:make" = "latest"
"dnf:ncurses" = "latest"
