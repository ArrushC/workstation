# ~/.config/starship.toml — managed by chezmoi
# Compact single-line prompt with leading clock, optimised for remote Linux dev work

"$schema" = 'https://starship.rs/config-schema.json'

# No blank line between consecutive prompts.
add_newline = false

format = """\
$time\
$username$hostname\
$directory\
$git_branch$git_status\
$cmd_duration\
$jobs\
$status\
$character\
"""

[time]
# #565f89 is Tokyo Night's "comment" palette color — designed to recede into
# the dark background while staying legible. Swap to another hex if a host
# uses a different scheme; ANSI names (`bright-black`, `dimmed white`) were
# tried and render poorly under WezTerm's Tokyo Night.
disabled    = false
time_format = "%H:%M:%S"
format      = '[\[$time\]]($style) '
style       = "#565f89"

[os]
# Disabled: on WSL the detection probe costs ~150-230ms per prompt render
# (vs <1ms for every other module). $os in the format string just renders
# empty when disabled — re-enable here if a host shows the module is fast.
disabled = true
style    = "bold blue"

[os.symbols]
Linux = " "

[username]
show_always = true
format      = "[$user]($style)@"
style_user  = "bold yellow"
style_root  = "bold red"

[hostname]
ssh_only   = false
ssh_symbol = " "
format     = "[$hostname$ssh_symbol]($style) "
style      = "bold cyan"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold blue"
read_only         = " 󰌾"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style  = "bold purple"

[git_status]
format     = "([$all_status$ahead_behind]($style) )"
style      = "bold red"
conflicted = "⚡"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
modified   = "!${count}"
untracked  = "?${count}"
staged     = "+${count}"

[cmd_duration]
min_time = 2_000
format   = "took [$duration]($style) "
style    = "bold yellow"

[jobs]
format    = "[$symbol$number]($style) "
symbol    = "✦"
style     = "bold cyan"
threshold = 1

[status]
disabled              = false
format                = "[$symbol$status]($style) "
symbol                = "✘"
not_executable_symbol = "✘"
not_found_symbol      = "✘"
sigint_symbol         = "✘"
signal_symbol         = "✘"
style                 = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
