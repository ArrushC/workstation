# ~/.config/starship.toml — managed by chezmoi
# Compact single-line prompt with leading clock, optimised for remote Linux dev work

"$schema" = 'https://starship.rs/config-schema.json'

# No blank line between consecutive prompts.
add_newline = false

format = """\
$time\
$username$hostname\
$shlvl\
$directory\
$cmd_duration\
$jobs\
$status\
$character\
"""

[time]
# `dimmed white` applies the ANSI dim attribute to white, so each terminal
# theme decides the actual rendered color — more portable than a hardcoded
# hex (the earlier #565f89 was tuned to Tokyo Night).
disabled    = false
time_format = "%H:%M:%S"
format      = '[\[$time\]]($style) '
style       = "dimmed white"

[os]
# Disabled: on WSL the detection probe costs ~150-230ms per prompt render
# (vs <1ms for every other module). $os in the format string just renders
# empty when disabled — re-enable here if a host shows the module is fast.
disabled = true
style    = "bold blue"

[os.symbols]
Linux = " "

[container]
# Renders when inside a container/chroot — distinguishes `docker exec`
# panes (e.g. into the dozzle container on dev_machine) from host
# shells. Cheap (reads /run/.containerenv or /proc/1/cgroup). To
# enable: set disabled = false AND add `$container` to the format
# string above (e.g. between `$hostname` and `$shlvl`).
disabled = true
symbol   = "⬢"
format   = "[$symbol \\[$name\\]]($style) "
style    = "bold red"

[shlvl]
# Surfaces shell-nesting depth past the outermost layer. Useful for
# chains like `WezTerm → zellij → ssh → zsh` where it's easy to lose
# track of which shell a command will run in. Default threshold is 2
# (renders when SHLVL >= 2 — i.e. you've sub-shelled at least once).
# Symbol is nf-md-layers-triple (U+F0F39) — visualises nested shell
# layers more directly than the previous ↕ up-down arrow.
disabled  = false
threshold = 2
symbol    = "󰼹"
format    = "[$symbol $shlvl]($style) "
style     = "dimmed white"

[username]
show_always = true
format      = "[$user]($style)@"
style_user  = "bold yellow"
style_root  = "bold red"

[hostname]
ssh_only   = false
ssh_symbol = " "
format     = "[$hostname$ssh_symbol]($style) "
style      = "bold cyan"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold blue"
read_only         = " 󰌾"

[git_branch]
# Disabled to keep the prompt narrow; rely on `git status` /
# `gst` (aliased) to surface branch state on demand. To re-enable,
# flip `disabled` and add `$git_branch` back to the format string.
disabled = true
format = "[$symbol$branch]($style) "
symbol = " "
style  = "bold purple"

[git_status]
# Disabled alongside [git_branch] — see note above.
disabled   = true
format     = "([$all_status$ahead_behind]($style) )"
style      = "bold red"
conflicted = "⚡"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
modified   = "!${count}"
untracked  = "?${count}"
staged     = "+${count}"

[cmd_duration]
min_time = 1_000
format   = "took [$duration]($style) "
style    = "bold yellow"

[jobs]
# Symbol is nf-fa-gear ( ) — visualises background work more clearly
# than the previous ✦ sparkle.
format    = "[$symbol $number]($style) "
symbol    = ""
style     = "bold cyan"
threshold = 1

[status]
# `common_meaning` maps known codes to labels (1 → ERROR, 126 → NOPERM,
# 127 → NOTFOUND, 2 → USAGE); `$maybe_int` falls back to the raw number
# for everything else. `recognize_signal_code = false` is deliberate —
# tools like ssh use exit codes >=128 for non-signal reasons (ssh: 255),
# and enabling it would silently subtract 128 and mislabel them.
# Symbol is nf-fa-times-circle ( ) — matches the visual weight of the
# rest of the Nerd Font prompt; replaces the previous ✘ heavy ballot X.
disabled              = false
recognize_signal_code = false
symbol                = ""
format                = '[$symbol $common_meaning$maybe_int]($style) '
style                 = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
