# ~/.config/starship.toml — managed by chezmoi
# Clean, informative prompt optimised for remote Linux dev work

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](bold green)$os$username$hostname$directory$git_branch$git_status$cmd_duration
[╰─](bold green)$character"""

[os]
disabled = false
style = "bold blue"

[os.symbols]
Linux = " "

[username]
show_always = true
format      = "[$user]($style)@"
style_user  = "bold yellow"
style_root  = "bold red"

[hostname]
ssh_only = false
format   = "[$hostname]($style) "
style    = "bold cyan"

[directory]
truncation_length    = 4
truncate_to_repo     = true
style                = "bold blue"
read_only            = " 󰌾"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style  = "bold purple"

[git_status]
format    = "([$all_status$ahead_behind]($style) )"
style     = "bold red"
conflicted = "⚡"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
modified   = "!${count}"
untracked  = "?${count}"
staged     = "+${count}"

[cmd_duration]
min_time = 2_000
format   = "took [$duration]($style) "
style    = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
