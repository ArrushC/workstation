# herdr config — deploys to ~/.config/herdr/config.toml (Linux dev_machine
# only; herdr itself is the dev-only agent multiplexer installed by make).
# Only this file is chezmoi-tracked: the rest of ~/.config/herdr/ is runtime
# state (sockets, logs, session.json, plugins/) and must stay untracked.
# After editing: `herdr server reload-config`.

onboarding = false
[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# --- herdr-file-viewer plugin keybindings ------------------------------------
# Plugin: github:smarzban/herdr-file-viewer — git-aware read-only file viewer
# (tree + diff/markdown/code panes). Installed pinned by chezmoi's
# run_once_install-herdr-plugins.sh; bindings verbatim from the plugin README:
# prefix+f opens the viewer in a split pane, prefix+shift+f in its own tab.

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
