# scripts/ws/actions.toml: the one curated catalogue behind `ws` (the searchable palette)
# and `wsh` (the cheatsheet, `ws help`), in every shell on both OSes. The palette adds the
# checkout's mise tasks and the current project's tasks to these; a curated entry with
# `task = "<name>"` replaces that task's discovered one. ASCII only: PowerShell 5.1
# consoles print the help. Checked by scripts/ws/tests (ids, kinds, one way to run each).
#
# Fields of an [[action]]:
#   id        unique and stable: the palette hands back only this, never the text it shows
#   title     what the palette lists       desc  one line on what it does
#   group     its wsh section (the [groups] order below)
#   kind      read    changes nothing (runs straight away)
#             change  writes files or host state (shows the exact command, then asks)
#             open    an interactive program: editor, picker, pager, session, ssh
#             info    text only
#   keywords  more search words; [synonyms] widens them (searching "rebuild" finds "fix")
#   os        ["linux"] or ["windows"] (default both)   shells  zsh, bash, nu, pwsh (default all)
#   requires  commands that must be on PATH for it to show
#   alias     the command wsh lists it under; `wsh = false` keeps it out of the cheatsheet
#   fixes     tasks/health row names it repairs (`ws health` offers it for those rows)
# and exactly one way to run it:
#   run       an argv, run without a shell; {home} {repo} {state} {arg} are filled in
#   pick      with run: what {arg} is chosen from (dotfile-targets)
#   task      a mise task of this checkout: mise -C ~ run <task> [args]
#   ws        a ws subcommand's argv
#   insert    a shell command (a shell function such as zs) put on your prompt to run;
#             where the shell can't take it (PowerShell), it is printed instead
#   cd        a directory for your shell to change to
#   edit      a file to open in the editor      doc  a repo file, optionally #a heading
#   text      the lines to show (kind = "info")

[groups]
order = ["workstation", "projects", "health", "shell", "zellij", "ssh", "clipboard", "python", "config", "docs"]
workstation = "Workstation (dotfiles; every ws* command pins mise -C to your home)"
projects = "Project workspaces"
health = "Health, updates and repairs"
shell = "Shell shortcuts"
zellij = "zellij"
ssh = "SSH"
clipboard = "Clipboard"
python = "Python"
config = "Configuration entry points (per host, untracked)"
docs = "Documentation"

[synonyms]
python = ["py", "venv", "virtualenv", "uv", "pip", "wpy", "interpreter"]
rebuild = ["reinstall", "regenerate", "refresh", "repair", "fix", "reset", "recreate"]
update = ["upgrade", "pull", "latest", "bump", "refresh", "newer"]
ssh = ["remote", "host", "hosts", "keys", "connect", "login", "server"]
clipboard = ["copy", "paste", "yank", "osc52", "clip"]
dotfiles = ["dotfile", "rc", "drift", "home", "deploy", "configs"]
reconcile = ["merge", "conflict", "record", "sync", "drift", "review"]
health = ["doctor", "check", "diagnose", "broken", "problem"]
project = ["workspace", "repo", "worktree", "session", "code"]
zellij = ["multiplexer", "tmux", "session", "pane", "layout"]
docs = ["help", "manual", "readme", "documentation", "howto"]
edit = ["change", "modify", "open"]
tasks = ["build", "test", "run", "make", "script"]

# --- workstation ----------------------------------------------------------------

[[action]]
id = "reconcile"
title = "Reconcile dotfiles"
desc = "review every managed file that differs from the repo: record, apply, merge, edit or skip each"
group = "workstation"
kind = "open"
keywords = ["dotfiles", "reconcile", "local", "edit", "baseline"]
alias = "ws reconcile"
ws = ["reconcile"]
fixes = ["dotfiles"]

[[action]]
id = "wse"
title = "Edit a dotfile's source"
desc = "mise dot edit <path>: edit a tracked file's source"
group = "workstation"
kind = "open"
keywords = ["dotfiles", "edit", "source"]
alias = "wse"
run = ["mise", "-C", "{home}", "dot", "edit", "{arg}"]
pick = "dotfile-targets"

[[action]]
id = "wsd"
title = "Preview pending dotfile changes"
desc = "mise dot diff: what an apply would change in your home"
group = "workstation"
kind = "read"
keywords = ["dotfiles", "diff"]
alias = "wsd"
run = ["mise", "-C", "{home}", "dot", "diff"]

[[action]]
id = "wsa"
title = "Apply the repo's dotfiles"
desc = "apply; warns and asks first if your home has an unrecorded local edit"
group = "workstation"
kind = "change"
keywords = ["dotfiles", "apply", "deploy"]
alias = "wsa"
ws = ["apply"]

[[action]]
id = "wsr"
title = "Record changed file entries"
desc = "mise dot add --changed: copy edited FILE entries back to their source (ws reconcile also handles files inside directory entries)"
group = "workstation"
kind = "change"
keywords = ["dotfiles", "record", "capture"]
alias = "wsr"
run = ["mise", "-C", "{home}", "dot", "add", "--changed"]

[[action]]
id = "wss"
title = "Dotfile status"
desc = "mise dot status: every managed file and its state"
group = "workstation"
kind = "read"
keywords = ["dotfiles", "status", "list"]
alias = "wss"
run = ["mise", "-C", "{home}", "dot", "status"]

[[action]]
id = "wsu-linux"
title = "Update this host"
desc = "mise run update: git pull --ff-only, then mise bootstrap (tools, dotfiles, system steps)"
group = "workstation"
kind = "change"
keywords = ["update", "pull", "bootstrap", "install"]
os = ["linux"]
alias = "wsu"
task = "update"

[[action]]
id = "wsu-windows"
title = "Update this host"
desc = "git pull, then mise bootstrap --only dotfiles,tools (bootstrap.ps1 updates mise and the GUI apps)"
group = "workstation"
kind = "change"
keywords = ["update", "pull", "bootstrap", "install"]
os = ["windows"]
alias = "wsu"
insert = "wsu"

[[action]]
id = "backups"
title = "Dotfile backups"
desc = "what reconcile and the pre-apply snapshot saved before overwriting, with restore commands"
group = "workstation"
kind = "read"
keywords = ["dotfiles", "backup", "restore", "undo", "recover", "lost"]
alias = "ws reconcile --backups"
ws = ["reconcile", "--backups"]

[[action]]
id = "palette"
title = "This palette"
desc = "search every workstation action by what you want to do (ws <words> starts with a search)"
group = "workstation"
kind = "info"
alias = "ws"
text = ["ws [words]: the palette; ws help (wsh): this cheatsheet"]
wsh = true

[[action]]
id = "wsh"
title = "Workstation cheatsheet"
desc = "this help: the ws* commands, shell shortcuts and per-host files"
group = "workstation"
kind = "read"
keywords = ["help", "cheatsheet", "aliases"]
alias = "wsh"
ws = ["help"]

[[action]]
id = "checkout"
title = "Go to the workstation checkout"
desc = "cd to ~/.config/mise, this host's checkout (commit and push from there)"
group = "workstation"
kind = "open"
keywords = ["repo", "git", "commit", "push", "checkout"]
cd = "{repo}"
fixes = ["repo checkout"]
wsh = false

