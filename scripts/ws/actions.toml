[[action]]
id = "cheat"
title = "Personal cheat sheet"
desc = "cheat workstation: the quick reference (cheat -e workstation edits it)"
group = "docs"
kind = "read"
keywords = ["docs", "cheat", "cheatsheet", "reference"]
os = ["linux"]
requires = ["cheat"]
alias = "cheat workstation"
run = ["cheat", "workstation"]

# --- notes: the cheatsheet's closing sections ----------------------------------------

[[note]]
title = "Common flow"
text = ["wse <file>   edit the source", "wsd          preview the change", "wsa          apply to ~"]

[[note]]
title = "When something edits a deployed file itself (Claude Code, Zed, Warp, WT)"
text = ["ws reconcile                      review each one: record, apply, merge, edit, skip",
        "wsr                               (file entries)",
        "mise dot add ~/.claude/agents     (a whole directory entry, by exact target path)"]

[[note]]
title = "Push tracked changes upstream"
os = ["linux"]
text = ["cd ~/.config/mise && git add -A && git commit -m '...' && git push"]

[[note]]
title = "Push tracked changes upstream"
os = ["windows"]
text = ["cd ~\\.config\\mise; git add -A; git commit -m '...'; git push"]

[[note]]
title = "Per-machine overrides (untracked)"
shells = ["zsh"]
text = ["~/.zshrc.local, ~/.ssh/config.local, ~/.config/mise/config.local.toml"]

[[note]]
title = "Per-machine overrides (untracked)"
shells = ["bash"]
text = ["~/.bashrc.local, ~/.ssh/config.local, ~/.config/mise/config.local.toml"]

[[note]]
title = "Per-machine overrides (untracked)"
shells = ["nu"]
text = ["%APPDATA%\\nushell\\autoload\\*.nu (Nushell), ~/.ssh/config.local, ~\\.config\\mise\\config.local.toml"]

[[note]]
title = "Per-machine overrides (untracked)"
shells = ["pwsh"]
text = ["Microsoft.PowerShell_profile.local.ps1 next to this profile, ~/.ssh/config.local, ~\\.config\\mise\\config.local.toml"]
