# config.owned.toml: owned-host tools on both OSes (loads when MISE_ENV has `owned`).
# Linux-only entries carry os = ["linux"]; the rest also install on the Windows host
# (%USERPROFILE%\.config\mise is this same checkout there).
[tools]
# The npm language servers ride node's postinstall so typescript-language-server
# finds typescript as a global sibling (separate npm: trees would break that). A
# changed postinstall only re-runs when node reinstalls; scripts/lib/mise-install.sh
# forces it. --allow-scripts=core-js silences npm 11's install-scripts warning.
node = { version = "26.10.0", postinstall = "npm install -g --allow-scripts=core-js typescript-language-server@6.0.1 typescript@5.9.3 bash-language-server@5.8.1 yaml-language-server@1.24.0 vscode-langservers-extracted@4.10.0" }
go = "1.27.1"
"go:golang.org/x/tools/gopls" = "0.23.0"
lua-language-server = "3.19.1"
"pypi:basedpyright" = "1.40.2"
"npm:ccstatusline" = "2.2.30"                 # Claude Code statusline; enforced statusLine command becomes plain `ccstatusline`
"github:ryanoasis/nerd-fonts" = { version = "3.5.1", asset_pattern = "JetBrainsMono.tar.xz" }   # JetBrainsMono Nerd Font, the only pin: tasks/fonts (Linux) and bootstrap.ps1 (Windows, via scripts/install-nerd-fonts.ps1) install its TTFs
herdr = { version = "0.9.3", os = ["linux"] }
opencode = "1.18.34"
"github:can1357/oh-my-pi" = "18.6.1"   # bare per-platform binary asset; Linux auto-strips the suffix to `omp` (bin= would make a non-.exe file on Windows)
"github:pwndbg/pwndbg" = { version = "2026.09.15", os = ["linux"], version_prefix = "", asset_pattern = "pwndbg_{{version}}_x86_64-portable.tar.xz", bin_path = "pwndbg/bin" }   # archive extracts a top-level pwndbg/ wrapper dir
"github:DevToys-app/DevToys" = { version = "2.0.9.0", platforms = { linux-x64 = { asset_pattern = "devtoys.cli_linux_x64_portable.zip", rename_exe = { "DevToys.CLI" = "devtoys.cli" } }, windows-x64 = { asset_pattern = "devtoys.cli_win_x64_portable.zip" } } }   # CLI only; per-platform assets
nushell = { version = "0.113.1", os = ["windows"] }   # Windows default shell (WT); launched via %LOCALAPPDATA%\mise\shims\nu.exe
"github:carapace-sh/carapace-bin" = { version = "1.8.0", os = ["windows"], asset_pattern = "carapace-bin_{{version}}_windows_amd64.zip" }   # Nushell's Tab completion for ~1000 CLIs (config.nu's external completer)
"github:dnGrep/dnGrep" = { version = "5.0.30.0", os = ["windows"], asset_pattern = "dnGrep.{{version}}.x64.zip" }   # GUI grep; Start Menu shortcut + settings seed by bootstrap.ps1
"github:LogExperts/LogExpert" = { version = "1.41.0", os = ["windows"], asset_pattern = "LogExpert.{{version}}.zip" }   # GUI log viewer (needs the .NET 10 Desktop Runtime); Start Menu shortcut by bootstrap.ps1

# ---------------------------------------------------------------------------
# Dotfiles gated on `owned` regardless of OS (Linux-only ones live in
# config.host.toml). Every entry is `copy`.
# ---------------------------------------------------------------------------
[dotfiles]
# Per-host opt-out: scripts/setup-ccstatusline.sh writes a CCSTATUSLINE-OPTOUT block
# into config.local.toml's own [dotfiles] table. `enabled = false` alone is silently
# ignored, so the written entry repeats `mode`. A live edit through ccstatusline's
# setup menu is recorded back with `wsr` (`mise dot add --changed`).
"~/.config/ccstatusline/settings.json" = { source = "dotfiles/config/ccstatusline/settings.json", mode = "copy" }

# ~/.claude tree. Directory mode 700 is restored by the post-dotfiles hook
# (config.linux.toml), since copy can't express a directory's mode. settings.json is
# merged by scripts/lib/claude-settings-merge.sh and settings.local.json is seeded if
# absent by tasks/bootstrap; neither is a [dotfiles] entry because Claude Code
# rewrites them. CLAUDE.md is the file agents are nudged to edit directly: `wsa`'s
# drift check (see CLAUDE.md) stops an apply from silently discarding such an edit.
"~/.claude/CLAUDE.md" = { source = "dotfiles/claude/CLAUDE.md", mode = "copy" }
"~/.claude/hooks" = { source = "dotfiles/claude/hooks", mode = "copy", exclude = [".vendor", ".gitkeep"] }   # dangerous-command-guard.sh, secret-guard.sh — both git mode 755; copy on a directory leaves unmanaged hooks (e.g. herdr-agent-state.sh) alone
"~/.claude/notify.sh" = { source = "dotfiles/claude/notify.sh", mode = "copy" }   # git mode 755; copy preserves the git-tracked executable bit from the source
# agents/commands are the two directories the user adds files to directly; capture
# a live addition with `mise dot add <dir>` (see CLAUDE.md).
"~/.claude/agents" = { source = "dotfiles/claude/agents", mode = "copy", exclude = [".vendor", ".gitkeep"] }
"~/.claude/commands" = { source = "dotfiles/claude/commands", mode = "copy", exclude = [".vendor", ".gitkeep"] }
"~/.claude/skills" = { source = "dotfiles/claude/skills", mode = "copy", exclude = [".vendor", ".gitkeep"] }   # workstation-lsp/ (.claude-plugin/plugin.json, .lsp.json, SKILL.md); copy so unmanaged skill dirs (e.g. computer-use, orca-cli, orchestration) survive
