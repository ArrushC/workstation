# ~/.config/mise/config.native.toml — non-WSL Linux DEV extras (MISE_ENV token
# `native`): the NFS client package group only (nfs-utils, nfs4-acl-tools,
# autofs). WSL hosts skip all of it (Windows owns the NFS/SMB client role
# there). Docker/Cockpit/rsyslog/Dozzle provisioning was removed from this
# repo (user decision, 2026-09-22) — mise no longer installs or configures
# them; hosts that already have them from an earlier `mise bootstrap` (or the
# Make era) keep whatever is installed and running, unmanaged, and nothing
# here updates it any more.

[bootstrap.packages]
"dnf:autofs" = "latest"                  # installed, NOT enabled — maps are per-host /etc config
"dnf:nfs-utils" = "latest"
"dnf:nfs4-acl-tools" = "latest"
