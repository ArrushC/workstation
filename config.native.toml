# config.native.toml: non-WSL Linux owned extras (MISE_ENV token `native`): the NFS
# client package group. WSL hosts skip it because Windows owns the NFS/SMB client role.

[bootstrap.packages]
"dnf:autofs" = "latest"                  # installed, NOT enabled — maps are per-host /etc config
"dnf:nfs-utils" = "latest"
"dnf:nfs4-acl-tools" = "latest"
