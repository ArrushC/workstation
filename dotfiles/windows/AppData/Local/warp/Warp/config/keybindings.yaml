# Pane mnemonics match Zellij's pane mode (d = split down, r = split right)
# so muscle memory transfers between local Warp panes and SSH+Zellij panes.
pane_group:add_down: alt-shift-D
pane_group:add_right: alt-shift-R
pane_group:navigate_left: alt-shift-left
pane_group:navigate_right: alt-shift-right
pane_group:navigate_up: alt-shift-up
pane_group:navigate_down: alt-shift-down
pane_group:toggle_maximize_pane: ctrl-shift-Z
workspace:increase_font_size: ctrl-=
workspace:decrease_font_size: ctrl--
workspace:reset_font_size: ctrl-0

# Warp-native blocks, history, and recovery.
workspace:show_command_search: ctrl-r
terminal:select_previous_block: ctrl-up
terminal:select_next_block: ctrl-down
terminal:select_bookmark_up: alt-up
terminal:select_bookmark_down: alt-down
terminal:bookmark_selected_block: ctrl-shift-B
terminal:copy_outputs: ctrl-shift-alt-C
terminal:open_block_list_context_menu_via_keybinding: ctrl-m
app:reopen_closed_session: ctrl-alt-t

# Warp-native discovery surfaces.
workspace:toggle_command_palette: ctrl-shift-P
workspace:toggle_launch_config_palette: ctrl-alt-l
input:toggle_workflows: ctrl-shift-R
